name: Inspect official Fluo numbering module

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-official-numbering-module.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GP Populate Anything API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,html
          from urllib.parse import urljoin
          s=requests.Session();s.headers['User-Agent']='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36'
          page=s.get('https://www.fluo.grandest.fr/nouveaux-numeros/',timeout=40).text
          print('PAGE_LEN',len(page))
          # Print the complete inline GPPA configuration for form 39.
          for pat in [r'var GPPA_FILTER_FIELD_MAP_39\s*=.*?;',r'var GPPA_FORM_39\s*=.*?;',r'var GPPA\s*=.*?;']:
              m=re.search(pat,page,re.S)
              print('CONFIG',m.group(0)[:12000] if m else 'NOT_FOUND')
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',page,re.I)
          target=None
          for src in scripts:
              if 'gppopulateanything' in src.lower(): target=urljoin('https://www.fluo.grandest.fr/nouveaux-numeros/',html.unescape(src));break
          print('PLUGIN',target)
          js=s.get(target,timeout=40).text
          print('PLUGIN_LEN',len(js))
          print('GPPA_LITERALS',sorted(set(re.findall(r'[A-Za-z0-9_-]*gppa[A-Za-z0-9_-]*',js,re.I))))
          for needle in ['AJAXURL','security','field-values','action:',"action=",'batch','populate']:
              print('\n===',needle,'===')
              for m in list(re.finditer(re.escape(needle),js,re.I))[:20]:
                  print(js[max(0,m.start()-900):min(len(js),m.end()+1500)].replace('\n',' ')[:2500])
          PY
