name: Mon SAEIV 1.0.37 source harmonize

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/v137-source-harmonize.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harmonize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Harmonize source version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          V='1.0.37'
          bp=Path('fluo_build.json')
          if bp.exists():
              d=json.loads(bp.read_text(encoding='utf-8'));d['version']=V;bp.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          mp=Path('manifest.webmanifest')
          m=json.loads(mp.read_text(encoding='utf-8'));m['name']='Mon SAEIV 1.0.37';m['start_url']='./?v=1.0.37';m['orientation']='any';m['description']='Mon SAEIV — SAEIV multiréseaux avec Espace conducteur, journaux, statistiques, véhicule, planning, GPS, annonces, comptage voyageurs et outils de service.';mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          sw=Path('sw.js')
          s=sw.read_text(encoding='utf-8')
          s=re.sub(r"const C='mon-saeiv-v1-0-\d+';","const C='mon-saeiv-v1-0-37';",s,count=1)
          s=re.sub(r"const CORE=\[[^\n]+\];","const CORE=['./','index.html','manifest.webmanifest','fluo_build.json','v128-gps.js','v128-offline.js','v130-session-orientation.js','v131-speech.js','v132-journals.js','v133-profile-journals.js','v134-journal-front.js','v135-journal-router.js','v136-driver-operations.js','v137-driver-hub.js'];",s,count=1)
          s=re.sub(r'1\.0\.\d+',V,s)
          if 'v137RuntimeDriverHub' not in s:
              anchor='  return t;\n}'
              extra='  if(!t.includes(\'id="v137RuntimeDriverHub"\'))t=t.replace(/<\\/body>\\s*<\\/html>\\s*$/i,`<script id="v137RuntimeDriverHub" src="./v137-driver-hub.js?v=1.0.37"><\\/script><\\/body><\\/html>`);\n  return t;\n}'
              if anchor in s:s=s.replace(anchor,extra)
          sw.write_text(s,encoding='utf-8')
          PY
          node --check sw.js
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/v137-source-harmonize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sw.js manifest.webmanifest fluo_build.json .github/workflows/v137-source-harmonize.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Mon SAEIV 1.0.37: harmonise les sources PWA'
          git push
