name: Patch Mon SAEIV 1.0.50 deploy
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch deployment pipeline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-pages.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace('1.0.48','1.0.50')
          if 'v150-journal-regulation.js' not in s:
              s=s.replace('v147-flow-journals-fix.js v148-continuous-day.js; do','v147-flow-journals-fix.js v148-continuous-day.js v150-journal-regulation.js; do')
              s=s.replace("'v147-flow-journals-fix','v148-continuous-day'","'v147-flow-journals-fix','v148-continuous-day','v150-journal-regulation'")
              s=s.replace("('v148RuntimeContinuousDay','v148-continuous-day.js'),","('v148RuntimeContinuousDay','v148-continuous-day.js'),\n            ('v150RuntimeJournalRegulation','v150-journal-regulation.js'),")
              s=s.replace("'v147-flow-journals-fix.js','v148-continuous-day.js','data/54/routes.json'","'v147-flow-journals-fix.js','v148-continuous-day.js','v150-journal-regulation.js','data/54/routes.json'")
              s=s.replace('v147-flow-journals-fix.js v148-continuous-day.js sw.js; do','v147-flow-journals-fix.js v148-continuous-day.js v150-journal-regulation.js sw.js; do')
              s=s.replace("grep -q 'v148RuntimeContinuousDay' site/index.html","grep -q 'v148RuntimeContinuousDay' site/index.html\n          grep -q 'v150RuntimeJournalRegulation' site/index.html")
              s=s.replace("grep -q 'v148-continuous-day.js' site/sw.js","grep -q 'v148-continuous-day.js' site/sw.js\n          grep -q 'v150-journal-regulation.js' site/sw.js")
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-pages.yml
          git commit -m "Mon SAEIV 1.0.50: publie les journaux arrivée départ régulation"
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase
          git rm .github/workflows/patch-v150-deploy.yml
          git commit -m "Remove temporary 1.0.50 patch workflow"
          git push
