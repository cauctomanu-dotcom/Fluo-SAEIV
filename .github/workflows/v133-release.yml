name: Mon SAEIV 1.0.33 release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v133-release
  cancel-in-progress: true

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch 1.0.33
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path

          # Index : le module est aussi référencé dans la source, pas seulement injecté au build.
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          if 'v133RuntimeProfileJournals' not in t:
              t=t.replace('</body>', '<script id="v133RuntimeProfileJournals" src="./v133-profile-journals.js?v=1.0.33"></script>\n</body>')
          t=t.replace('manifest.webmanifest?v=1.0.32','manifest.webmanifest?v=1.0.33')
          t=t.replace('sw.js?v=1.0.32','sw.js?v=1.0.33')
          t=t.replace('<title>Mon SAEIV · 1.0.32</title>','<title>Mon SAEIV · 1.0.33</title>')
          p.write_text(t,encoding='utf-8')

          # Service worker : nouveau cache et nouveaux runtimes.
          p=Path('sw.js')
          t=p.read_text(encoding='utf-8')
          t=t.replace("mon-saeiv-v1-0-32","mon-saeiv-v1-0-33")
          if "'v133-profile-journals.js'" not in t:
              t=t.replace("'v132-journals.js']","'v132-journals.js','v133-profile-journals.js']")
          t=t.replace('?v=1.0.32','?v=1.0.33')
          t=t.replace("'1.0.32'","'1.0.33'")
          t=t.replace('1.0.32-radio-gps-offline-continuity','1.0.33-radio-gps-offline-continuity')
          if 'v133RuntimeProfileJournals' not in t:
              marker='  return t;\n}'
              inject='  if(!t.includes(\'id="v133RuntimeProfileJournals"\'))t=t.replace(/<\\/body>\\s*<\\/html>\\s*$/i,`<script id="v133RuntimeProfileJournals" src="./v133-profile-journals.js?v=1.0.33"><\\/script><\\/body><\\/html>`);\n'
              t=t.replace(marker,inject+marker)
          p.write_text(t,encoding='utf-8')

          # Manifest public.
          p=Path('manifest.webmanifest')
          t=p.read_text(encoding='utf-8').replace('Mon SAEIV 1.0.32','Mon SAEIV 1.0.33').replace('./?v=1.0.32','./?v=1.0.33')
          p.write_text(t,encoding='utf-8')

          # Métadonnées de build si la version courante est présente.
          p=Path('fluo_build.json')
          if p.exists():
              t=p.read_text(encoding='utf-8').replace('"version": "1.0.32"','"version": "1.0.33"')
              p.write_text(t,encoding='utf-8')
          PY

          rm -f .github/workflows/v133-release.yml

      - name: Commit release
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js manifest.webmanifest fluo_build.json .github/workflows/v133-release.yml
          if git diff --cached --quiet; then
            echo "No release changes"
            exit 0
          fi
          git commit -m "Mon SAEIV 1.0.33: journaux fiables et Mon profil"
          git push
