name: Mon SAEIV 1.0.29 Version Fix

on:
  push:
    paths:
      - '.github/workflows/monsaev-v129-version-fix.yml'

permissions:
  contents: write

jobs:
  fix-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Uniformiser la version 1.0.29
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<title>Mon SAEIV · 1.0.22</title>','<title>Mon SAEIV · 1.0.29</title>')
          s=s.replace("document.title='Mon SAEIV · 1.0.22';","document.title='Mon SAEIV · 1.0.29';")
          s=s.replace("eyebrow.textContent = 'MON SAEIV · 1.0.22';","eyebrow.textContent = 'MON SAEIV · 1.0.29';")
          p.write_text(s)
          p=Path('fluo_build.json')
          b=json.loads(p.read_text())
          b['version']='1.0.29'
          p.write_text(json.dumps(b,ensure_ascii=False,indent=2)+'\n')
          PY
          grep -q '<title>Mon SAEIV · 1.0.29</title>' index.html
          grep -q '"version": "1.0.29"' fluo_build.json
          node --check sw.js
      - name: Committer et nettoyer
        run: |
          rm .github/workflows/monsaev-v129-version-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html fluo_build.json .github/workflows/monsaev-v129-version-fix.yml
          git commit -m 'Mon SAEIV 1.0.29: harmonise la version'
          git push
