name: Mon SAEIV 1.0.37 startup repair

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/v137-source-repair.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Repair V136 menu observer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v136-driver-operations.js')
          t=p.read_text(encoding='utf-8')
          old="const old=q('v133ProfileBtn');if(old){old.textContent='👤 Mon profil';old.classList.add('v316-menu-entry')}"
          new="const old=q('v133ProfileBtn');if(old){if(old.textContent!=='👤 Mon profil')old.textContent='👤 Mon profil';old.classList.add('v316-menu-entry')}"
          if old not in t:
              print('Profile text rewrite already repaired or source changed')
          else:
              t=t.replace(old,new,1)
          oldobs="new MutationObserver(()=>ensureMenu()).observe(menu,{childList:true,subtree:true})"
          newobs="new MutationObserver(()=>ensureMenu()).observe(menu,{childList:true})"
          if oldobs in t:t=t.replace(oldobs,newobs,1)
          p.write_text(t,encoding='utf-8')
          PY
          node --check v136-driver-operations.js
      - name: Commit repaired source and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/v137-source-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v136-driver-operations.js .github/workflows/v137-source-repair.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Mon SAEIV 1.0.37: corrige le gel du menu au démarrage'
          git push
