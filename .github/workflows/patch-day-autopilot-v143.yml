    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch day autopilot
        shell: bash
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          p=Path("v137-driver-hub.js")
          text=p.read_text(encoding="utf-8")
          patch=base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8")
          marker="Mon SAEIV 1.0.43 — pilote automatique de « Ma journée »"
          text=text.replace("const VERSION='1.0.42';","const VERSION='1.0.43';",1)
          text=text.replace("console.info('[Mon SAEIV] 1.0.42 Espace conducteur centralisé actif');","console.info('[Mon SAEIV] 1.0.43 Espace conducteur centralisé actif');",1)
          if marker not in text:
              text=text.rstrip()+"\n\n"+patch.strip()+"\n"
          p.write_text(text,encoding="utf-8")
          PY
          node --check v137-driver-hub.js
          git diff --check
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-day-autopilot-v143.yml
          git add v137-driver-hub.js
          git commit -m "Mon SAEIV 1.0.43: enchaine automatiquement Ma journee"
          git push origin HEAD:main
