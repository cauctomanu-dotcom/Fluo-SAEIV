name: Validate Mon SAEIV 1.0.87
on:
  push:
    branches: [ "fix/1.0.87-supervision-responsive" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check v183-live-supervision.js
          node --check sw.js
      - name: Responsive supervision invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('v183-live-supervision.js').read_text(encoding='utf-8')
          for token in ('1.0.87','v183-mobile-tabs','v183MobileMap','v183MobileList','data-mobile-view','setMobileView','100dvh','safe-area-inset-bottom','orientationchange','max-width:700px'):
              assert token in s, token
          w=Path('.github/workflows/deploy-pages.yml').read_text(encoding='utf-8')
          assert '1.0.87' in w and 'range(22,87)' in w
          assert "const CACHE='mon-saeiv-clean-1.0.87'" in Path('sw.js').read_text(encoding='utf-8')
          print('Supervision responsive 1.0.87 OK')
          PY
