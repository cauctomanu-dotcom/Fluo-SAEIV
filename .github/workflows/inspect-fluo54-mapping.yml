name: Inspect exact Fluo 54 renumbering

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-fluo54-mapping.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read TC Infos new-line pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request
          pages={
            '455':'https://tc-infos.fr/reseau/983/ligne/38937',
            '460':'https://tc-infos.fr/reseau/983/ligne/38938',
            '461':'https://tc-infos.fr/reseau/983/ligne/38939',
            '465':'https://tc-infos.fr/reseau/983/ligne/38961',
            '466':'https://tc-infos.fr/reseau/983/ligne/38964',
            '468':'https://tc-infos.fr/reseau/983/ligne/38969',
            '469':'https://tc-infos.fr/reseau/983/ligne/39564',
            '470':'https://tc-infos.fr/reseau/983/ligne/39567',
            '471':'https://tc-infos.fr/reseau/983/ligne/39569',
            '472':'https://tc-infos.fr/reseau/983/ligne/39570',
            '480':'https://tc-infos.fr/reseau/983/ligne/39568',
            '490':'https://tc-infos.fr/reseau/983/ligne/39563',
            '495':'https://tc-infos.fr/reseau/983/ligne/39565',
            '496':'https://tc-infos.fr/reseau/983/ligne/39566',
          }
          for new,url in pages.items():
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              try:
                  html=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','ignore')
              except Exception as e:
                  print('MAP',new,'ERROR',repr(e)); continue
              text=re.sub(r'<script.*?</script>',' ',html,flags=re.I|re.S)
              text=re.sub(r'<style.*?</style>',' ',text,flags=re.I|re.S)
              text=re.sub(r'<[^>]+>',' ',text)
              text=re.sub(r'\s+',' ',text)
              m=re.search(r'(?:ancienne ligne|ligne est devenu(?:e)?(?: la)? ligne)\s*(R?\d+)',text,re.I)
              # also print useful neighbourhood for manual validation
              hits=[]
              for pat in ('ancienne ligne','devenu','R060','R330','R340','R350','R360','R370','R380','R410','R570','R580','R650','R670','R710','R800'):
                  i=text.lower().find(pat.lower())
                  if i>=0: hits.append(text[max(0,i-100):i+180])
              print('MAP',new,'=>',m.group(1).upper() if m else 'UNKNOWN','|',' || '.join(hits[:3]))
          PY
