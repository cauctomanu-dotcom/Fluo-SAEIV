name: Inspect official Fluo renumbering AJAX

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-fluo54-mapping.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Gravity Forms / GPPA parameters
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o /tmp/fluo.html 'https://www.fluo.grandest.fr/nouveaux-numeros/'
          python - <<'PY'
          from pathlib import Path
          import re, html
          s=Path('/tmp/fluo.html').read_text(encoding='utf-8',errors='ignore')
          print('HTML_BYTES',len(s))
          patterns=[
            r'<form[^>]+id=["\']gform_[^>]+>',
            r'gform_wrapper[_-]?\d+', r'gform_\d+', r'field_\d+_\d+',
            r'gppa[^\n<]{0,3000}', r'populate[^\n<]{0,3000}',
            r'gp_populate_anything[^\n<]{0,3000}', r'GPPA[^\n<]{0,3000}',
            r'ajaxurl[^\n<]{0,1000}', r'admin-ajax\.php[^\n<]{0,1000}',
          ]
          seen=set()
          for pat in patterns:
            print('=== PATTERN',pat,'===')
            for m in re.finditer(pat,s,re.I|re.S):
              a=max(0,m.start()-800); b=min(len(s),m.end()+1800)
              out=re.sub(r'\s+',' ',html.unescape(s[a:b]))
              if out in seen: continue
              seen.add(out)
              print(out[:5000])
              if len(seen)>40: break
          # Inline scripts are especially useful for GPPA configuration.
          for block in re.findall(r'<script[^>]*>(.*?)</script>',s,re.I|re.S):
            low=block.lower()
            if any(k in low for k in ('gppa','populate anything','gform.initialize','gform.initializeonloaded')):
              print('=== INLINE ===')
              print(re.sub(r'\s+',' ',html.unescape(block))[:15000])
          PY
