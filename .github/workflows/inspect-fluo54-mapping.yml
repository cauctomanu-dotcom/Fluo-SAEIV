name: Query official Fluo renumbering API

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-fluo54-mapping.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query GPPA batch endpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, urllib.parse, json, re, html
          page='https://www.fluo.grandest.fr/nouveaux-numeros/'
          req=urllib.request.Request(page,headers={'User-Agent':'Mozilla/5.0'})
          s=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
          m=re.search(r'var GPPA = \{.*?"NONCE":"([^"]+)"',s,re.S)
          if not m: raise SystemExit('GPPA nonce not found')
          nonce=m.group(1)
          print('NONCE_FOUND',bool(nonce))
          endpoint='https://www.fluo.grandest.fr/wp-admin/admin-ajax.php?action=gppa_get_batch_field_html'
          def call(fields,values):
              payload={
                'form-id':39,
                'lead-id':None,
                'field-ids':fields,
                'gravityview-meta':False,
                'field-values':values,
                'merge-tags':[],
                'lmt-nonces':{},
                'current-merge-tag-values':{},
                'security':nonce,
                'show_admin_fields_in_ajax':''
              }
              data=json.dumps(payload,separators=(',',':')).encode()
              rq=urllib.request.Request(endpoint,data=data,headers={
                'User-Agent':'Mozilla/5.0','Content-Type':'application/json',
                'Referer':page,'Origin':'https://www.fluo.grandest.fr'
              })
              raw=urllib.request.urlopen(rq,timeout=30).read().decode('utf-8','ignore')
              return raw
          for fields,values,label in [
            ([1],{},'FIELD1_EMPTY'),
            ([4],{'1':'R350'},'R350'),
            ([4],{'1':'54R350'},'54R350'),
            ([4],{'1':'R360'},'R360'),
            ([4],{'1':'54R360'},'54R360'),
          ]:
              try:
                  raw=call(fields,values)
                  print('===',label,'===')
                  print(raw[:20000])
              except Exception as e:
                  print('ERROR',label,repr(e))
          PY
