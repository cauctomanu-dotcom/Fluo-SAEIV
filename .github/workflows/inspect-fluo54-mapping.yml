name: Inspect official Fluo advanced select AJAX

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-fluo54-mapping.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GP Advanced Select JavaScript
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.fluo.grandest.fr/wp-content/plugins/gpadvancedselect/js/built/gp-advanced-select.js'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o /tmp/gpads.js "$URL"
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/gpads.js').read_text(encoding='utf-8',errors='ignore')
          print('JS_BYTES',len(s))
          for needle in ['action','ajax','lazyLoad','load','search','nonce','security','formId','fieldId','admin-ajax','gpadvs']:
              print('===',needle,'===')
              c=0
              for m in re.finditer(re.escape(needle),s,re.I):
                  out=re.sub(r'\s+',' ',s[max(0,m.start()-600):min(len(s),m.end()+1200)])
                  print(out[:2200])
                  c+=1
                  if c>=15: break
          strings=set(re.findall(r'["\']([A-Za-z0-9_\-]{4,100})["\']',s))
          for x in sorted(strings):
              if any(k in x.lower() for k in ('ajax','advanced','select','search','choice','field','gpadv')):
                  print('STRING',x)
          PY
