name: Inspect official Fluo renumbering module

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-fluo54-mapping.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read official Fluo renumbering page
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o /tmp/fluo.html 'https://www.fluo.grandest.fr/nouveaux-numeros/'
          python - <<'PY'
          from pathlib import Path
          import re, html
          s=Path('/tmp/fluo.html').read_text(encoding='utf-8',errors='ignore')
          print('HTML_BYTES',len(s))
          print('R350_COUNT',s.upper().count('R350'))
          # Print neighborhoods around the 54 regular old numbers.
          for old in ['R060','R330','R340','R350','R360','R370','R380','R410','R570','R580','R650','R670','R710','R800']:
              up=s.upper(); pos=0; found=0
              while True:
                  i=up.find(old,pos)
                  if i<0: break
                  found+=1
                  snippet=s[max(0,i-500):i+800]
                  snippet=re.sub(r'\s+',' ',html.unescape(snippet))
                  print('OLD',old,'HIT',found,'|',snippet)
                  pos=i+len(old)
                  if found>=5: break
          # Surface likely JSON / select / JS structures involving old/new numbers.
          for pat in [r'R350.{0,500}465',r'465.{0,500}R350',r'R360.{0,500}468',r'468.{0,500}R360',r'R370.{0,500}466',r'466.{0,500}R370']:
              for m in re.finditer(pat,s,re.I|re.S):
                  snippet=re.sub(r'\s+',' ',html.unescape(m.group(0)))
                  print('PAIR',pat,'|',snippet[:1200])
          # List JS assets that may carry form population data.
          for u in re.findall(r'<script[^>]+src=["\']([^"\']+)',s,re.I):
              if any(k in u.lower() for k in ('form','gravity','fluo','numero','script','acf')):
                  print('SCRIPT',u)
          PY
