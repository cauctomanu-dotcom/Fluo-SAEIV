name: Inspect official Fluo GPPA AJAX action

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-fluo54-mapping.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GP Populate Anything JavaScript
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.fluo.grandest.fr/wp-content/plugins/gppopulateanything/js/built/gp-populate-anything.js?ver%5B0%5D=gform_gravityforms&ver%5B1%5D=jquery'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o /tmp/gppa.js "$URL"
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/gppa.js').read_text(encoding='utf-8',errors='ignore')
          print('JS_BYTES',len(s))
          needles=['action','gppa','populate','ajax','nonce','fieldId','formId','field_id','form_id','batch','object_type','get_field','get_batch']
          for needle in needles:
              print('===',needle,'===')
              count=0
              for m in re.finditer(re.escape(needle),s,re.I):
                  a=max(0,m.start()-450); b=min(len(s),m.end()+900)
                  out=re.sub(r'\s+',' ',s[a:b])
                  print(out[:1500])
                  count+=1
                  if count>=12: break
          # Pull literal strings likely used as WP admin-ajax action names.
          strings=set(re.findall(r'["\']([A-Za-z0-9_\-]{4,80})["\']',s))
          for x in sorted(strings):
              lx=x.lower()
              if any(k in lx for k in ('gppa','populate','batch','object','field')):
                  print('STRING',x)
          PY
