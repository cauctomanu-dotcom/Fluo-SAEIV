name: Patch Mon SAEIV 1.0.48 runtime
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('v137-driver-hub.js')
          s=p.read_text()
          s=s.replace("const VERSION='1.0.46';","const VERSION='1.0.48';")
          s=s.replace("if(fromDay)setTimeout(()=>clickNextDayAction(token),260);","if(fromDay&&!window.MonSAEIVFlowV148?.installed)setTimeout(()=>clickNextDayAction(token),260);")
          if 'v148RuntimeContinuousDay' not in s:
              s += "\n\n'use strict';\n/* Mon SAEIV 1.0.48 — charge le fil continu de la journée. */\n(()=>{if(document.getElementById('v148RuntimeContinuousDay'))return;const s=document.createElement('script');s.id='v148RuntimeContinuousDay';s.async=false;s.src='./v148-continuous-day.js?v=1.0.48';document.head.appendChild(s)})();\n"
          p.write_text(s)

          p=Path('v144-day-hlp-driver.js')
          s=p.read_text()
          old="setTimeout(()=>{markHlpDone(item.id);resetHlpState();q('v144HlpDriver')?.classList.add('hidden');if(dayRunning())setTimeout(()=>launchActiveAfterHlp(),180)},650)"
          new="setTimeout(()=>{markHlpDone(item.id);resetHlpState();q('v144HlpDriver')?.classList.add('hidden');try{window.dispatchEvent(new CustomEvent('mon-saeiv-hlp-complete',{detail:{itemId:item.id}}))}catch{};if(dayRunning()&&!window.MonSAEIVFlowV148?.installed)setTimeout(()=>launchActiveAfterHlp(),180)},650)"
          if old in s: s=s.replace(old,new)
          s=s.replace("document.addEventListener('click',e=>{\n    const startDay=", "document.addEventListener('click',e=>{\n    if(window.MonSAEIVFlowV148?.installed)return;\n    const startDay=")
          s=s.replace("window.MonSAEIVDayAutopilotV144={installed:true,version:'1.0.44',start:","window.MonSAEIVDayAutopilotV144={installed:true,version:'1.0.48',start:")
          p.write_text(s)

          p=Path('v147-flow-journals-fix.js')
          s=p.read_text()
          s=s.replace("function install(){installStyle();installDayFlow();installJournalFlow();versionUi();", "function install(){installStyle();installJournalFlow();versionUi();")
          s=s.replace("document.title='Mon SAEIV · 1.0.47'","document.title='Mon SAEIV · 1.0.48'")
          s=s.replace("Version 1.0.47","Version 1.0.48")
          p.write_text(s)

          p=Path('sw.js')
          s=p.read_text()
          s=s.replace("const C='mon-saeiv-v1-0-40';","const C='mon-saeiv-v1-0-48';")
          s=s.replace("'v137-driver-hub.js'];","'v137-driver-hub.js','v144-day-hlp-driver.js','v147-flow-journals-fix.js','v148-continuous-day.js'];")
          marker='  return t;\n}'
          inject="""  if(!t.includes('id=\"v144RuntimeDayAutopilotDirect\"'))t=t.replace(/<\\/body>\\s*<\\/html>\\s*$/i,`<script id=\"v144RuntimeDayAutopilotDirect\" src=\"./v144-day-hlp-driver.js?v=1.0.48\"><\\/script><\\/body><\\/html>`);\n  if(!t.includes('id=\"v148RuntimeContinuousDay\"'))t=t.replace(/<\\/body>\\s*<\\/html>\\s*$/i,`<script id=\"v148RuntimeContinuousDay\" src=\"./v148-continuous-day.js?v=1.0.48\"><\\/script><\\/body><\\/html>`);\n"""
          if 'v148RuntimeContinuousDay' not in s and marker in s:
              s=s.replace(marker,inject+marker)
          p.write_text(s)
          PY
          node --check v131-speech.js
          node --check v144-day-hlp-driver.js
          node --check v147-flow-journals-fix.js
          node --check v148-continuous-day.js
          git config user.name "cauctomanu-dotcom"
          git config user.email "cauctomanu@gmail.com"
          git add v137-driver-hub.js v144-day-hlp-driver.js v147-flow-journals-fix.js v148-continuous-day.js sw.js
          git commit -m "Mon SAEIV 1.0.48: fiabilise annonces, HLP et fil continu" || true
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/patch-v148-runtime.yml
          git commit -m "Remove temporary 1.0.48 patch workflow"
          git push
