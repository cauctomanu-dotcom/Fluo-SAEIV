name: Mon SAEIV 1.0.39 static Fluo data

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v139-static-fluo-data.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build robust static Fluo data support
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,json,re
          VERSION='1.0.39'
          p=Path('build_gtfs.py')
          t=p.read_text(encoding='utf-8')
          start=t.index('FEEDS = {')
          end=t.index('\n}\n',start)+3
          feeds="""FEEDS = {
              '57': {'label':'Moselle (57)','url':'https://www.data.gouv.fr/api/1/datasets/r/42be7185-b2a8-4d1e-80c4-f7c402655260','source':'Fluo Grand Est 57'},
              '54': {'label':'Meurthe-et-Moselle (54)','url':'https://transport.data.gouv.fr/resources/80423/download','source':'Fluo Grand Est 54 — GTFS officiel'},
              '67': {'label':'Bas-Rhin (67)','url':'https://transport.data.gouv.fr/resources/80417/download','source':'Fluo Grand Est 67 — GTFS officiel'},
              '68': {'label':'Haut-Rhin (68)','url':'https://transport.data.gouv.fr/resources/80419/download','source':'Fluo Grand Est 68 — GTFS officiel'},
          }
          """
          t=t[:start]+feeds+t[end:]
          old="""        stop_times[tid].append({
              'seq': seq,
              'stop_id': sid,
              'arrival': clean(st.get('arrival_time')),
              'departure': clean(st.get('departure_time')),
          })"""
          new="""        stop_times[tid].append({
              'seq': seq,
              'stop_id': sid,
              'arrival': clean(st.get('arrival_time')),
              'departure': clean(st.get('departure_time')),
              'pickup_type': clean(st.get('pickup_type')) or '0',
              'drop_off_type': clean(st.get('drop_off_type')) or '0',
          })"""
          if old not in t: raise SystemExit('stop_times block not found')
          t=t.replace(old,new,1)
          old="""                'times': [[x['arrival'], x['departure']] for x in seq_items],
              })"""
          new="""                'times': [[x['arrival'], x['departure']] for x in seq_items],
                  'demand': [{'pickup_type': x.get('pickup_type','0'), 'drop_off_type': x.get('drop_off_type','0')} for x in seq_items],
              })"""
          if old not in t: raise SystemExit('trip times block not found')
          t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')
          runtime_b64=''
          Path('v139-fluo-published-data.js').write_bytes(base64.b64decode(runtime_b64))
          ip=Path('index.html'); x=ip.read_text(encoding='utf-8')
          x=re.sub(r'manifest\.webmanifest\?v=1\.0\.\d+',f'manifest.webmanifest?v={VERSION}',x,count=1)
          x=re.sub(r'<title>Mon SAEIV · 1\.0\.\d+</title>',f'<title>Mon SAEIV · {VERSION}</title>',x,count=1)
          x=re.sub(r"const APP_VERSION = '1\.0\.\d+';",f"const APP_VERSION = '{VERSION}';",x,count=1)
          x=re.sub(r'<script id="v139RuntimeFluoPublished"[^>]*></script>\s*','',x)
          i=x.rfind('</body>')
          if i<0: raise SystemExit('final body not found')
          x=x[:i]+f'<script id="v139RuntimeFluoPublished" src="./v139-fluo-published-data.js?v={VERSION}"></script>\n'+x[i:]
          if 'monSaeivCashV123' not in x or 'localStorage.clear' in x: raise SystemExit('cash safety guard failed')
          ip.write_text(x,encoding='utf-8')
          mp=Path('manifest.webmanifest'); m=json.loads(mp.read_text(encoding='utf-8'));m['name']=f'Mon SAEIV {VERSION}';m['start_url']=f'./?v={VERSION}';m['orientation']='any';m['description']='Mon SAEIV — données Fluo 54/67/68 préconstruites côté serveur, GPS, annonces, journaux, planning et caisse locale préservée.';mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          bp=Path('fluo_build.json'); d=json.loads(bp.read_text(encoding='utf-8'));d['version']=VERSION;d['fluo_static_data_v1_0_39']={'reason':'corrige Données indisponibles en servant les GTFS préparés côté GitHub','departments_built':['54','57','67','68'],'54_from':'2026-09-01','67_2026':'régulières inchangées jusqu’en septembre 2027','cash_storage':'monSaeivCashV123 inchangé'};bp.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          sw=Path('sw.js'); s=sw.read_text(encoding='utf-8');s=re.sub(r"const C='mon-saeiv-v1-0-\d+';","const C='mon-saeiv-v1-0-39';",s,count=1);s=re.sub(r'1\.0\.\d+',VERSION,s);sw.write_text(s,encoding='utf-8')
          PY
          node --check v139-fluo-published-data.js
          grep -q "'67'" build_gtfs.py
          grep -q "'68'" build_gtfs.py
          grep -q "pickup_type" build_gtfs.py
          grep -q "v139RuntimeFluoPublished" index.html
          grep -q "monSaeivCashV123" index.html
          ! grep -q "localStorage.clear" index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build_gtfs.py v139-fluo-published-data.js index.html manifest.webmanifest fluo_build.json sw.js
          git commit -m 'Mon SAEIV 1.0.39: fiabilise les données Fluo 54 67 68'
          git push
