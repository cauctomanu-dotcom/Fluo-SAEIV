name: Attach planning TAD assistant 1.0.45
on:
  push:
    paths:
      - '.github/workflows/attach-v145-planning-tad.yml'
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attach runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./v145-planning-tad.js?v=1.0.45"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('balise </body> introuvable')
              s=s.replace('</body>', tag+'\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Mon SAEIV 1.0.45: load planning TAD assistant"
            git push
          fi
      - name: Remove temporary workflow
        run: |
          git pull --rebase
          git rm .github/workflows/attach-v145-planning-tad.yml
          git commit -m "Cleanup temporary planning TAD workflow"
          git push
