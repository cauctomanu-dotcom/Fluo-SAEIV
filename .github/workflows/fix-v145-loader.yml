name: Fix planning TAD loader placement
on:
  push:
    paths:
      - '.github/workflows/fix-v145-loader.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move runtime loader to real document end
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./v145-planning-tad.js?v=1.0.45"></script>'
          s=s.replace(tag+'\n','').replace(tag,'')
          pos=s.rfind('</body>')
          if pos < 0:
              raise SystemExit('balise finale </body> introuvable')
          s=s[:pos]+tag+'\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Mon SAEIV 1.0.45: fix planning TAD loader placement"
          git push
      - name: Remove temporary workflow
        run: |
          git pull --rebase
          git rm .github/workflows/fix-v145-loader.yml
          git commit -m "Cleanup temporary TAD loader fix workflow"
          git push
