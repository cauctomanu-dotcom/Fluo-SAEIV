name: Attach Ma journee 1.0.43

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/attach-v143-day-autopilot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attach runtime and validate
        shell: bash
        run: |
          node --check v143-day-autopilot.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v137-driver-hub.js')
          text=p.read_text(encoding='utf-8')
          text=text.replace("const VERSION='1.0.42';","const VERSION='1.0.43';",1)
          text=text.replace("console.info('[Mon SAEIV] 1.0.42 Espace conducteur centralisé actif');","console.info('[Mon SAEIV] 1.0.43 Espace conducteur centralisé actif');",1)
          marker='v143RuntimeDayAutopilot'
          if marker not in text:
              text += "\n\n'use strict';\n/* Mon SAEIV 1.0.43 — chargement du pilote automatique Ma journée. */\n(()=>{\n  if(document.getElementById('v143RuntimeDayAutopilot'))return;\n  const s=document.createElement('script');\n  s.id='v143RuntimeDayAutopilot';\n  s.src='./v143-day-autopilot.js?v=1.0.43';\n  s.async=false;\n  document.head.appendChild(s);\n})();\n"
          p.write_text(text,encoding='utf-8')
          PY
          node --check v137-driver-hub.js
          git diff --check
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/attach-v143-day-autopilot.yml
          git add v137-driver-hub.js
          git commit -m "Mon SAEIV 1.0.43: attach Ma journee autopilot"
          git push origin HEAD:main
