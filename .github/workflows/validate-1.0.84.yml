name: Validate Mon SAEIV 1.0.84
on:
  push:
    branches: [ "fix/1.0.84-ios-passenger-audio" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check v131-speech.js
          node --check v184-navigation-resume.js
          node --check sw.js
      - name: iPhone speech invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('v131-speech.js').read_text(encoding='utf-8')
          for token in ('1.0.84','IS_IOS','IOS_SILENT_WAV','iosCloudAudio','iosCloudUnlocked','CLOUD_START_TIMEOUT_MS','unlockIOSCloudAudio','audio IA non démarré','NotAllowedError'):
              assert token in s, token
          assert "const media=IS_IOS?iosCloudPlayer():new Audio()" in s
          assert "if(IS_IOS&&!iosCloudUnlocked)return launchLocal" in s
          w=Path('.github/workflows/deploy-pages.yml').read_text(encoding='utf-8')
          assert '1.0.84' in w
          assert 'range(22,84)' in w
          assert "const CACHE='mon-saeiv-clean-1.0.84'" in Path('sw.js').read_text(encoding='utf-8')
          print('Audio iPhone 1.0.84 source checks OK')
          PY
