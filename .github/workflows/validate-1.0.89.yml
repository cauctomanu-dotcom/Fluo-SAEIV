name: Validate Mon SAEIV 1.0.89
on:
  push:
    branches: [ "fix/1.0.89-test-driver-simulation" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check v167-generation-engine.js
          node --check v177-smart-rest-unavailability.js
          node --check v183-live-supervision.js
          node --check v174-grid-editor.js
          node --check sw.js
      - name: Test-driver simulation invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          g=Path('v167-generation-engine.js').read_text(encoding='utf-8')
          for token in ("1.0.89","isTestDriver","if(isTestDriver(driver))return true","knowsLine(seg,setting,driver)"):
              assert token in g, token
          s=Path('v177-smart-rest-unavailability.js').read_text(encoding='utf-8')
          for token in ("1.0.89","engine.isTestDriver?.(d)","engine.knowsLine?.(s,settings.get(String(d.user_id)),d)"):
              assert token in s, token
          v=Path('v183-live-supervision.js').read_text(encoding='utf-8')
          for token in ("1.0.89","simulatedRows","routeShape","simulation_progress","SIMULATION","plan_items","liveOwners"):
              assert token in v, token
          e=Path('v174-grid-editor.js').read_text(encoding='utf-8')
          assert "/^TEST\\d+$/i" in e
          w=Path('.github/workflows/deploy-pages.yml').read_text(encoding='utf-8')
          assert '1.0.89' in w and 'range(22,89)' in w
          assert "const CACHE='mon-saeiv-clean-1.0.89'" in Path('sw.js').read_text(encoding='utf-8')
          print('Mon SAEIV 1.0.89 TEST simulation OK')
          PY
