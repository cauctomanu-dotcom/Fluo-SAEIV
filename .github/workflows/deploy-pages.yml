# Déploiement final Mon SAEIV 1.0.35 — routeur unique Journaux iOS
name: Build and deploy Fluo SAEIV

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild expected V11 folders
        shell: bash
        run: |
          set -e
          mkdir -p scripts/trace_overrides site/data
          cp build_gtfs.py scripts/build_gtfs.py
          cp 54.json scripts/trace_overrides/54.json
          cp 57.json scripts/trace_overrides/57.json
          cp index.html site/index.html
          cp app.js site/app.js
          cp styles.css site/styles.css
          cp sw.js site/sw.js
          cp manifest.webmanifest site/manifest.webmanifest
          [ -f fluo_build.json ] && cp fluo_build.json site/fluo_build.json || true
          for f in v128-gps.js v128-offline.js v130-session-orientation.js v131-speech.js v132-journals.js v133-profile-journals.js v134-journal-front.js v135-journal-router.js; do
            [ -f "$f" ] && cp "$f" "site/$f"
          done
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('site/index.html')
          t=p.read_text(encoding='utf-8')
          # Versions des modules runtime déjà présents.
          for old in ('1.0.32','1.0.33','1.0.34'):
              t=t.replace(f'./v132-journals.js?v={old}','./v132-journals.js?v=1.0.35')
              t=t.replace(f'./v133-profile-journals.js?v={old}','./v133-profile-journals.js?v=1.0.35')
              t=t.replace(f'./v134-journal-front.js?v={old}','./v134-journal-front.js?v=1.0.35')
          # Garantit une seule injection des modules modernes tout en fin de document.
          if 'v133RuntimeProfileJournals' not in t:
              i=t.rfind('</body>')
              if i!=-1:t=t[:i]+'<script id="v133RuntimeProfileJournals" src="./v133-profile-journals.js?v=1.0.35"></script>\n'+t[i:]
          if 'v134RuntimeJournalFront' not in t:
              i=t.rfind('</body>')
              if i!=-1:t=t[:i]+'<script id="v134RuntimeJournalFront" src="./v134-journal-front.js?v=1.0.35"></script>\n'+t[i:]
          if 'v135RuntimeJournalRouter' not in t:
              i=t.rfind('</body>')
              if i!=-1:t=t[:i]+'<script id="v135RuntimeJournalRouter" src="./v135-journal-router.js?v=1.0.35"></script>\n'+t[i:]
          for old in ('1.0.32','1.0.33','1.0.34'):
              t=t.replace(f'manifest.webmanifest?v={old}','manifest.webmanifest?v=1.0.35')
              t=t.replace(f'sw.js?v={old}','sw.js?v=1.0.35')
              t=t.replace(f'<title>Mon SAEIV · {old}</title>','<title>Mon SAEIV · 1.0.35</title>')
          p.write_text(t,encoding='utf-8')
          # Le build publié doit afficher la même version, même si le fichier source contient un historique plus ancien.
          bp=Path('site/fluo_build.json')
          if bp.exists():
              try:
                  d=json.loads(bp.read_text(encoding='utf-8'));d['version']='1.0.35';bp.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              except Exception as e: print('build json version warning',e)
          PY
          touch site/data/.gitkeep

      - name: Download and prepare official Fluo GTFS 54 and 57
        run: python scripts/build_gtfs.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload SAEIV website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
