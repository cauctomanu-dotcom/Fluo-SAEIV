name: Build and deploy Fluo SAEIV

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild expected V11 folders
        shell: bash
        run: |
          set -e
          mkdir -p scripts/trace_overrides site/data
          cp build_gtfs.py scripts/build_gtfs.py
          cp 54.json scripts/trace_overrides/54.json
          cp 57.json scripts/trace_overrides/57.json
          cp index.html site/index.html
          cp app.js site/app.js
          cp styles.css site/styles.css
          cp sw.js site/sw.js
          cp manifest.webmanifest site/manifest.webmanifest
          touch site/data/.gitkeep

      - name: Download and prepare official Fluo GTFS 54 and 57
        run: python scripts/build_gtfs.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload SAEIV website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
