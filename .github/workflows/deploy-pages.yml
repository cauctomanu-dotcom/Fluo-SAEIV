name: Build and deploy Mon SAEIV isolated gateway

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assemble application source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site scripts
          mkdir -p site/data scripts/trace_overrides

          cp build_gtfs.py scripts/build_gtfs.py
          cp build_gtfs_2026.py scripts/build_gtfs_2026.py
          cp 54.json scripts/trace_overrides/54.json
          cp 57.json scripts/trace_overrides/57.json

          cp index.html app.js styles.css sw.js manifest.webmanifest fluo-numbering-2026.json site/
          [ -f fluo_build.json ] && cp fluo_build.json site/fluo_build.json || true

          for f in \
            v128-gps.js v128-offline.js \
            v130-session-orientation.js v131-speech.js v132-journals.js \
            v133-profile-journals.js v134-journal-front.js v135-journal-router.js \
            v136-driver-operations.js v137-driver-hub.js v141-static-fluo.js \
            v144-day-hlp-driver.js v145-planning-tad.js v146-planning-tad-bridge.js \
            v147-flow-journals-fix.js v148-continuous-day.js v150-journal-regulation.js \
            v154-planning-service-times.js v155-planning-cut-percent.js \
            v156-supabase-sync.js v157-exploitation.js \
            v159-clean-runtime.js v160-entry-bridge.js v161-admin-accounts.js \
            v162-full-account-sync.js v163-exploitation-planner.js v164-driver-settings.js \
            v165-exploitation-board.js v167-generation-engine.js v168-service-grid.js \
            v167-exploitation-performance.js v174-grid-editor.js; do
            test -f "$f"
            cp "$f" "site/$f"
          done

      - name: Normalize external modules once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('site/v136-driver-operations.js')
          t=p.read_text(encoding='utf-8')
          t=t.replace(
              "const old=q('v133ProfileBtn');if(old){old.textContent='👤 Mon profil';old.classList.add('v316-menu-entry')}",
              "const old=q('v133ProfileBtn');if(old){if(old.textContent!='👤 Mon profil')old.textContent='👤 Mon profil';old.classList.add('v316-menu-entry')}"
          )
          t=t.replace(
              "new MutationObserver(()=>ensureMenu()).observe(menu,{childList:true,subtree:true})",
              "new MutationObserver(()=>ensureMenu()).observe(menu,{childList:true})"
          )
          p.write_text(t,encoding='utf-8')

          p=Path('site/v133-profile-journals.js')
          t=p.read_text(encoding='utf-8')
          t=t.replace("let b=q('v133ProfileBtn');","let b=q('v133ProfileBtn')||q('v137ProfileBtn');")
          p.write_text(t,encoding='utf-8')

          p=Path('site/v128-gps.js')
          t=p.read_text(encoding='utf-8')
          t=t.replace('if(now-M.lastLeafletAt<40)return;','if(now-M.lastLeafletAt<18)return;')
          t=t.replace('if(now-M.lastCameraAt<50||!state?.nav?.follow)return;','if(now-M.lastCameraAt<33||!state?.nav?.follow)return;')
          t=t.replace('if(M.lastVisualAt&&ts-M.lastVisualAt<33)return;','if(M.lastVisualAt&&ts-M.lastVisualAt<16)return;')
          t=t.replace('visualFps:30,cameraFps:20','visualFps:60,cameraFps:30')
          p.write_text(t,encoding='utf-8')

          p=Path('site/v165-exploitation-board.js')
          t=p.read_text(encoding='utf-8')
          t=t.replace("!['auto_hlp','auto_cut'].includes(x.source)","!['auto_hlp','auto_cut','auto_service'].includes(x.source)")
          p.write_text(t,encoding='utf-8')
          PY

      - name: Build official Fluo data and sanitize legacy application
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_gtfs_2026.py

      - name: Externalize every executable application script
        shell: bash
        run: |
          set -euo pipefail
          python externalize_runtime.py site/index.html

      - name: Split gateway and stamp release 1.0.74
        shell: bash
        run: |
          set -euo pipefail
          mv site/index.html site/app.html
          cp login.html site/index.html
          cp login-gateway.js site/login-gateway.js
          cp gateway-full-backup.js site/gateway-full-backup.js
          cp gateway-driver-parking.js site/gateway-driver-parking.js
          python - <<'PY'
          from pathlib import Path

          old_versions=[f'1.0.{n}' for n in range(22,74)]
          for p in Path('site').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.html','.js','.json','.webmanifest'}:
                  continue
              try:
                  t=p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for old in old_versions:
                  t=t.replace(old,'1.0.74')
              p.write_text(t,encoding='utf-8')

          app=Path('site/app.html')
          t=app.read_text(encoding='utf-8')
          modules=(
            'v161-admin-accounts.js','v162-full-account-sync.js','v163-exploitation-planner.js',
            'v164-driver-settings.js','v165-exploitation-board.js','v167-generation-engine.js',
            'v168-service-grid.js','v167-exploitation-performance.js','v174-grid-editor.js'
          )
          for name in modules:
              tag=f'<script src="./{name}?v=1.0.74"></script>'
              if tag not in t:
                  if '</body>' not in t:
                      raise SystemExit('balise </body> absente de app.html')
                  t=t.replace('</body>',tag+'\n</body>',1)
          app.write_text(t,encoding='utf-8')
          PY

      - name: Validate isolated runtime 1.0.74
        shell: bash
        run: |
          set -euo pipefail
          count="$(find site/runtime -maxdepth 1 -name 'part-*.js' | wc -l | tr -d ' ')"
          test "$count" -gt 10
          find site/runtime -maxdepth 1 -name 'part-*.js' -print0 | xargs -0 -n1 node --check

          for f in \
            login-gateway.js gateway-full-backup.js gateway-driver-parking.js \
            v128-gps.js v128-offline.js v130-session-orientation.js v131-speech.js v132-journals.js \
            v133-profile-journals.js v134-journal-front.js v135-journal-router.js v136-driver-operations.js \
            v137-driver-hub.js v141-static-fluo.js v144-day-hlp-driver.js v145-planning-tad.js \
            v146-planning-tad-bridge.js v147-flow-journals-fix.js v148-continuous-day.js \
            v150-journal-regulation.js v154-planning-service-times.js v155-planning-cut-percent.js \
            v156-supabase-sync.js v157-exploitation.js v159-clean-runtime.js v160-entry-bridge.js \
            v161-admin-accounts.js v162-full-account-sync.js v163-exploitation-planner.js \
            v164-driver-settings.js v165-exploitation-board.js v167-generation-engine.js \
            v168-service-grid.js v167-exploitation-performance.js v174-grid-editor.js sw.js; do
            node --check "site/$f"
          done

          python - <<'PY'
          import re
          from pathlib import Path
          app=Path('site/app.html').read_text(encoding='utf-8')
          gateway=Path('site/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script\b([^>]*)>(.*?)</script\s*>',app,re.I|re.S)
          inline=[]
          for attrs,body in scripts:
              if re.search(r'\bsrc\s*=',attrs,re.I):
                  continue
              typ=re.search(r'\btype\s*=\s*(["\'])(.*?)\1',attrs,re.I|re.S)
              if typ and typ.group(2).strip().lower() not in ('','text/javascript','application/javascript','module'):
                  continue
              if body.strip(): inline.append(body[:80])
          assert not inline, f'JavaScript inline résiduel: {inline[:2]}'
          for name in ('v165-exploitation-board.js','v167-generation-engine.js','v168-service-grid.js','v167-exploitation-performance.js','v174-grid-editor.js'):
              assert f'{name}?v=1.0.74' in app
          assert '<title>Mon SAEIV · 1.0.74</title>' in app
          assert 'login-gateway.js?v=1.0.74' in gateway
          editor=Path('site/v174-grid-editor.js').read_text(encoding='utf-8')
          for token in ('v174SelectionBar','contextmenu','cut_overrides','delete_test_driver','25 %','Retirer de la grille'):
              assert token in editor
          print('Mon SAEIV 1.0.74 validé · sélection multiple + édition grille + conducteurs test')
          PY

          grep -q "const CACHE='mon-saeiv-clean-1.0.74'" site/sw.js
          grep -q '"name": "Mon SAEIV 1.0.74"' site/manifest.webmanifest
          grep -q './app.html' site/sw.js
          grep -q './login-gateway.js' site/sw.js
          grep -q '57SMH04' site/data/57/routes.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Mon SAEIV website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
