# Déploiement final Mon SAEIV 1.0.36 — outils terrain conducteur
name: Build and deploy Fluo SAEIV

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild expected V11 folders
        shell: bash
        run: |
          set -e
          mkdir -p scripts/trace_overrides site/data
          cp build_gtfs.py scripts/build_gtfs.py
          cp 54.json scripts/trace_overrides/54.json
          cp 57.json scripts/trace_overrides/57.json
          cp index.html site/index.html
          cp app.js site/app.js
          cp styles.css site/styles.css
          cp sw.js site/sw.js
          cp manifest.webmanifest site/manifest.webmanifest
          [ -f fluo_build.json ] && cp fluo_build.json site/fluo_build.json || true
          for f in v128-gps.js v128-offline.js v130-session-orientation.js v131-speech.js v132-journals.js v133-profile-journals.js v134-journal-front.js v135-journal-router.js v136-driver-operations.js; do
            [ -f "$f" ] && cp "$f" "site/$f"
          done
          python - <<'PY'
          from pathlib import Path
          import json,re
          VERSION='1.0.36'
          p=Path('site/index.html')
          t=p.read_text(encoding='utf-8')
          for mod in ('v130-session-orientation','v131-speech','v132-journals','v133-profile-journals','v134-journal-front','v135-journal-router'):
              t=re.sub(rf'\./{re.escape(mod)}\.js\?v=1\.0\.\d+',f'./{mod}.js?v={VERSION}',t)
          injections=[
            ('v133RuntimeProfileJournals','v133-profile-journals.js'),
            ('v134RuntimeJournalFront','v134-journal-front.js'),
            ('v135RuntimeJournalRouter','v135-journal-router.js'),
            ('v136RuntimeDriverOperations','v136-driver-operations.js'),
          ]
          for ident,src in injections:
              if ident not in t:
                  i=t.rfind('</body>')
                  if i!=-1:t=t[:i]+f'<script id="{ident}" src="./{src}?v={VERSION}"></script>\n'+t[i:]
          t=re.sub(r'manifest\.webmanifest\?v=1\.0\.\d+',f'manifest.webmanifest?v={VERSION}',t)
          t=re.sub(r'sw\.js\?v=1\.0\.\d+',f'sw.js?v={VERSION}',t)
          t=re.sub(r'<title>Mon SAEIV · 1\.0\.\d+</title>',f'<title>Mon SAEIV · {VERSION}</title>',t)
          p.write_text(t,encoding='utf-8')

          # Service worker publié : nouveau cache + tous les runtimes indispensables.
          sw=Path('site/sw.js')
          s=sw.read_text(encoding='utf-8')
          s=re.sub(r"const C='mon-saeiv-v1-0-\d+';", "const C='mon-saeiv-v1-0-36';", s, count=1)
          s=re.sub(r"const CORE=\[[^\n]+\];", "const CORE=['./','index.html','manifest.webmanifest','fluo_build.json','v128-gps.js','v128-offline.js','v130-session-orientation.js','v131-speech.js','v132-journals.js','v133-profile-journals.js','v134-journal-front.js','v135-journal-router.js','v136-driver-operations.js'];", s, count=1)
          s=re.sub(r'1\.0\.\d+',VERSION,s)
          anchor='  return t;\n}'
          extra='''  if(!t.includes('id="v134RuntimeJournalFront"'))t=t.replace(/<\\/body>\\s*<\\/html>\\s*$/i,`<script id="v134RuntimeJournalFront" src="./v134-journal-front.js?v=1.0.36"><\\/script><\\/body><\\/html>`);\n  if(!t.includes('id="v135RuntimeJournalRouter"'))t=t.replace(/<\\/body>\\s*<\\/html>\\s*$/i,`<script id="v135RuntimeJournalRouter" src="./v135-journal-router.js?v=1.0.36"><\\/script><\\/body><\\/html>`);\n  if(!t.includes('id="v136RuntimeDriverOperations"'))t=t.replace(/<\\/body>\\s*<\\/html>\\s*$/i,`<script id="v136RuntimeDriverOperations" src="./v136-driver-operations.js?v=1.0.36"><\\/script><\\/body><\\/html>`);\n  return t;\n}'''
          if 'v136RuntimeDriverOperations' not in s and anchor in s:s=s.replace(anchor,extra)
          sw.write_text(s,encoding='utf-8')

          mp=Path('site/manifest.webmanifest')
          try:
              m=json.loads(mp.read_text(encoding='utf-8'))
              m['name']='Mon SAEIV 1.0.36';m['start_url']='./?v=1.0.36';m['orientation']='any'
              mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          except Exception as e: print('manifest version warning',e)
          bp=Path('site/fluo_build.json')
          if bp.exists():
              try:
                  d=json.loads(bp.read_text(encoding='utf-8'));d['version']=VERSION;bp.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              except Exception as e: print('build json version warning',e)
          PY
          touch site/data/.gitkeep

      - name: Validate runtime JavaScript
        shell: bash
        run: |
          set -e
          node --check site/v132-journals.js
          node --check site/v133-profile-journals.js
          node --check site/v134-journal-front.js
          node --check site/v135-journal-router.js
          node --check site/v136-driver-operations.js
          node --check site/sw.js

      - name: Download and prepare official Fluo GTFS 54 and 57
        run: python scripts/build_gtfs.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload SAEIV website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
