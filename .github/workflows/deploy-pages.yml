name: Build and deploy Mon SAEIV isolated gateway

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assemble application source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site scripts
          mkdir -p site/data scripts/trace_overrides

          cp build_gtfs.py scripts/build_gtfs.py
          cp build_gtfs_2026.py scripts/build_gtfs_2026.py
          cp 54.json scripts/trace_overrides/54.json
          cp 57.json scripts/trace_overrides/57.json

          cp index.html app.js styles.css sw.js manifest.webmanifest fluo-numbering-2026.json voyageurs.html voyageurs.css voyageurs.js tracking-core.js v182-live-tracking.js v183-live-supervision.js v184-navigation-resume.js v185-line-thermometer.js site/
          [ -f fluo_build.json ] && cp fluo_build.json site/fluo_build.json || true

          for f in \
            v128-gps.js v128-offline.js \
            v130-session-orientation.js v131-speech.js v132-journals.js \
            v133-profile-journals.js v134-journal-front.js v135-journal-router.js \
            v136-driver-operations.js v137-driver-hub.js v141-static-fluo.js \
            v144-day-hlp-driver.js v145-planning-tad.js v146-planning-tad-bridge.js \
            v147-flow-journals-fix.js v148-continuous-day.js v150-journal-regulation.js \
            v154-planning-service-times.js v155-planning-cut-percent.js \
            v156-supabase-sync.js v157-exploitation.js \
            v159-clean-runtime.js v160-entry-bridge.js v161-admin-accounts.js \
            v162-full-account-sync.js v163-exploitation-planner.js v164-driver-settings.js \
            v165-exploitation-board.js v167-generation-engine.js v168-service-grid.js \
            v167-exploitation-performance.js v174-grid-editor.js v176-driver-absences.js \
            v177-smart-rest-unavailability.js v178-sick-reassignment.js v179-minimal-repair.js \
            v180-dispatch-messages.js v185-line-thermometer.js v186-enterprise-admin.js v187-collaborative-planning.js v188-driver-inbox.js v189-collective-tickets.js v190-weekly-planning.js v191-bulk-drivers.js v192-collective-smart.js v193-published-driver-edits.js v194-sick-approval-batches.js v195-intuitive-segment-change.js v196-generation-feedback.js v197-service-blocks.js v198-planning-ux.js v199-cockpit-responsive.js v200-home-voice-test.js v201-holiday-crew-ui.js; do
            test -f "$f"
            cp "$f" "site/$f"
          done

      - name: Normalize external modules once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('site/v136-driver-operations.js')
          t=p.read_text(encoding='utf-8')
          t=t.replace(
              "const old=q('v133ProfileBtn');if(old){old.textContent='👤 Mon profil';old.classList.add('v316-menu-entry')}",
              "const old=q('v133ProfileBtn');if(old){if(old.textContent!='👤 Mon profil')old.textContent='👤 Mon profil';old.classList.add('v316-menu-entry')}"
          )
          t=t.replace(
              "new MutationObserver(()=>ensureMenu()).observe(menu,{childList:true,subtree:true})",
              "new MutationObserver(()=>ensureMenu()).observe(menu,{childList:true})"
          )
          old_preflight="async function preflightChecks(mode){const st=globalThis.state,gps=mode==='gps',veh=readVehicle(),bat=await batteryInfo(),perm=await permissionGeo();let storage=null;try{storage=await navigator.storage?.estimate?.()}catch{}let sw=false;try{sw=!!navigator.serviceWorker?.controller}catch{}let cache=false;try{cache=typeof caches!=='undefined'&&(await caches.keys()).some(k=>k.startsWith('mon-saeiv-v1-'))}catch{}const course=!!st?.pattern?.stops?.length&&!!st?.pattern?.shape?.length,tts='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;return ["
          new_preflight="""async function preflightChecks(mode){
            let st=globalThis.state,gps=mode==='gps',veh=readVehicle(),bat=await batteryInfo(),perm=await permissionGeo();
            let storage=null;try{storage=await navigator.storage?.estimate?.()}catch{}
            let sw=false;try{sw=!!navigator.serviceWorker?.controller}catch{}
            let cache=false;try{cache=typeof caches!=='undefined'&&(await caches.keys()).some(k=>k.startsWith('mon-saeiv-v1-')||k.startsWith('mon-saeiv-clean-'))}catch{}
            const hasGeometry=()=>!!globalThis.state?.pattern?.stops?.length&&Array.isArray(globalThis.state?.pattern?.shape)&&globalThis.state.pattern.shape.length>=2;
            let course=hasGeometry();
            if(!course){
              try{
                const preparedId=sessionStorage.getItem('fluo-v316-prepared-item');
                if(!globalThis.state?.pattern&&preparedId&&window.FluoPlanningV316?.prepareLinkedCourse){
                  const item=window.FluoPlanningV316.items?.().find(x=>String(x.id)===String(preparedId));
                  if(item)await window.FluoPlanningV316.prepareLinkedCourse(item);
                }
                if(globalThis.state?.pattern?.stops?.length&&!hasGeometry()&&typeof ensureExactPatternGeometry==='function'){
                  await ensureExactPatternGeometry(globalThis.state.pattern);
                }
              }catch(e){console.warn('[Mon SAEIV] pré-vol : récupération géométrie impossible',e)}
              course=hasGeometry();st=globalThis.state;
            }
            const tts='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
            return ["""
          if old_preflight not in t:
              raise SystemExit('pré-vol historique introuvable dans v136-driver-operations.js')
          t=t.replace(old_preflight,new_preflight,1)
          p.write_text(t,encoding='utf-8')

          p=Path('site/v133-profile-journals.js')
          t=p.read_text(encoding='utf-8')
          t=t.replace("let b=q('v133ProfileBtn');","let b=q('v133ProfileBtn')||q('v137ProfileBtn');")
          p.write_text(t,encoding='utf-8')

          p=Path('site/v128-gps.js')
          t=p.read_text(encoding='utf-8')
          t=t.replace('if(now-M.lastLeafletAt<40)return;','if(now-M.lastLeafletAt<18)return;')
          t=t.replace('if(now-M.lastCameraAt<50||!state?.nav?.follow)return;','if(now-M.lastCameraAt<33||!state?.nav?.follow)return;')
          t=t.replace('if(M.lastVisualAt&&ts-M.lastVisualAt<33)return;','if(M.lastVisualAt&&ts-M.lastVisualAt<16)return;')
          t=t.replace('visualFps:30,cameraFps:20','visualFps:60,cameraFps:30')
          t=t.replace(
              "const deviation=window.FluoOpsV29?.isDeviationActive?.()===true;",
              "const deviation=window.FluoOpsV29?.isDeviationActive?.()===true||window.MonSAEIVNavigationV184?.isRecovering?.()===true;"
          )
          p.write_text(t,encoding='utf-8')

          p=Path('site/v165-exploitation-board.js')
          t=p.read_text(encoding='utf-8')
          t=t.replace("!['auto_hlp','auto_cut'].includes(x.source)","!['auto_hlp','auto_cut','auto_service'].includes(x.source)")
          p.write_text(t,encoding='utf-8')
          PY

      - name: Build official Fluo data and sanitize legacy application
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_gtfs_2026.py

      - name: Externalize every executable application script
        shell: bash
        run: |
          set -euo pipefail
          python externalize_runtime.py site/index.html

      - name: Split gateway and stamp release 1.0.112
        shell: bash
        run: |
          set -euo pipefail
          mv site/index.html site/app.html
          cp login.html site/index.html
          cp login-gateway.js site/login-gateway.js
          cp gateway-full-backup.js site/gateway-full-backup.js
          cp gateway-driver-parking.js site/gateway-driver-parking.js
          python - <<'PY'
          from pathlib import Path
          import shutil

          old_versions=[f'1.0.{n}' for n in range(22,112)]
          for p in Path('site').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.html','.js','.json','.webmanifest'}:
                  continue
              try:
                  t=p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for old in old_versions:
                  t=t.replace(old,'1.0.112')
              p.write_text(t,encoding='utf-8')

          app=Path('site/app.html')
          t=app.read_text(encoding='utf-8')
          early='<script src="./v184-navigation-resume.js?v=1.0.112"></script>'
          if early not in t:
              if '</head>' not in t:
                  raise SystemExit('balise </head> absente de app.html')
              t=t.replace('</head>',early+'\n</head>',1)
          modules=(
            'v161-admin-accounts.js','v162-full-account-sync.js','v163-exploitation-planner.js',
            'v164-driver-settings.js','v165-exploitation-board.js','v167-generation-engine.js',
            'v168-service-grid.js','v167-exploitation-performance.js','v174-grid-editor.js',
            'v176-driver-absences.js','v177-smart-rest-unavailability.js','v178-sick-reassignment.js',
            'v179-minimal-repair.js','v180-dispatch-messages.js','tracking-core.js','v182-live-tracking.js',
            'v183-live-supervision.js','v185-line-thermometer.js','v186-enterprise-admin.js','v187-collaborative-planning.js','v188-driver-inbox.js','v189-collective-tickets.js','v190-weekly-planning.js','v191-bulk-drivers.js','v192-collective-smart.js','v193-published-driver-edits.js','v194-sick-approval-batches.js','v195-intuitive-segment-change.js','v196-generation-feedback.js','v197-service-blocks.js','v198-planning-ux.js','v199-cockpit-responsive.js','v200-home-voice-test.js','v201-holiday-crew-ui.js'
          )
          for name in modules:
              tag=f'<script src="./{name}?v=1.0.112"></script>'
              if tag not in t:
                  if '</body>' not in t:
                      raise SystemExit('balise </body> absente de app.html')
                  t=t.replace('</body>',tag+'\n</body>',1)
          app.write_text(t,encoding='utf-8')

          # Adresse voyageurs distincte de l'application interne.
          public=Path('site/voyageurs')
          public.mkdir(exist_ok=True)
          shutil.copy2('site/voyageurs.html',public/'index.html')
          for name in ('voyageurs.css','voyageurs.js','tracking-core.js'):
              shutil.copy2(Path('site')/name,public/name)
          PY

      - name: Validate isolated runtime 1.0.112
        shell: bash
        run: |
          set -euo pipefail
          count="$(find site/runtime -maxdepth 1 -name 'part-*.js' | wc -l | tr -d ' ')"
          test "$count" -gt 10
          find site/runtime -maxdepth 1 -name 'part-*.js' -print0 | xargs -0 -n1 node --check

          for f in \
            login-gateway.js gateway-full-backup.js gateway-driver-parking.js \
            v128-gps.js v128-offline.js v130-session-orientation.js v131-speech.js v132-journals.js \
            v133-profile-journals.js v134-journal-front.js v135-journal-router.js v136-driver-operations.js \
            v137-driver-hub.js v141-static-fluo.js v144-day-hlp-driver.js v145-planning-tad.js \
            v146-planning-tad-bridge.js v147-flow-journals-fix.js v148-continuous-day.js \
            v150-journal-regulation.js v154-planning-service-times.js v155-planning-cut-percent.js \
            v156-supabase-sync.js v157-exploitation.js v159-clean-runtime.js v160-entry-bridge.js \
            v161-admin-accounts.js v162-full-account-sync.js v163-exploitation-planner.js \
            v164-driver-settings.js v165-exploitation-board.js v167-generation-engine.js \
            v168-service-grid.js v167-exploitation-performance.js v174-grid-editor.js \
            v176-driver-absences.js v177-smart-rest-unavailability.js v178-sick-reassignment.js \
            v179-minimal-repair.js v180-dispatch-messages.js tracking-core.js v182-live-tracking.js v183-live-supervision.js v184-navigation-resume.js v185-line-thermometer.js v186-enterprise-admin.js v187-collaborative-planning.js v188-driver-inbox.js v189-collective-tickets.js v190-weekly-planning.js v191-bulk-drivers.js v192-collective-smart.js v193-published-driver-edits.js v194-sick-approval-batches.js v195-intuitive-segment-change.js v196-generation-feedback.js v197-service-blocks.js v198-planning-ux.js v199-cockpit-responsive.js v200-home-voice-test.js v201-holiday-crew-ui.js voyageurs.js sw.js; do
            node --check "site/$f"
          done

          node tests/driver-line-v191.test.cjs
          node tests/unified-planning-v194.test.cjs
          node tests/generation-observable-v197.test.cjs
          node tests/daily-service-generation-v198.test.cjs
          node tests/draft-visibility-v199.test.cjs
          node tests/service-envelope-ui-v1100.test.cjs
          node tests/driver-day-detail-v1101.test.cjs
          node tests/cockpit-controls-v1102.test.cjs
          node tests/iphone-audio-responsive-v1103.test.cjs
          node tests/home-voice-android-v1104.test.cjs
          node tests/rene-antoni-toussaint-v1104.test.cjs
          node tests/published-change-consent-v195.test.cjs
          node tests/intuitive-segment-v196.test.cjs
          node tests/planning-workflow-v192.test.cjs
          grep -q "catalogue complet lignes exploitation" site/v165-exploitation-board.js
          grep -q "gesture-initialized-webaudio-resilient" site/v131-speech.js
          grep -q "arrêt demandé = Web Audio + duck radio réversible" site/app.js
          grep -q "arrêt demandé = Web Audio + duck radio réversible" site/runtime/part-*.js
          grep -q "wasPlayingBeforeDuck" site/runtime/part-*.js

          python - <<'PY'
          import re
          from pathlib import Path
          app=Path('site/app.html').read_text(encoding='utf-8')
          gateway=Path('site/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script\b([^>]*)>(.*?)</script\s*>',app,re.I|re.S)
          inline=[]
          for attrs,body in scripts:
              if re.search(r'\bsrc\s*=',attrs,re.I):
                  continue
              typ=re.search(r'\btype\s*=\s*(["\'])(.*?)\1',attrs,re.I|re.S)
              if typ and typ.group(2).strip().lower() not in ('','text/javascript','application/javascript','module'):
                  continue
              if body.strip(): inline.append(body[:80])
          assert not inline, f'JavaScript inline résiduel: {inline[:2]}'
          for name in ('v165-exploitation-board.js','v167-generation-engine.js','v168-service-grid.js','v167-exploitation-performance.js','v174-grid-editor.js','v176-driver-absences.js','v177-smart-rest-unavailability.js','v178-sick-reassignment.js','v179-minimal-repair.js','v180-dispatch-messages.js','tracking-core.js','v182-live-tracking.js','v183-live-supervision.js'):
              assert f'{name}?v=1.0.112' in app
          assert 'v184-navigation-resume.js?v=1.0.112' in app
          assert 'v185-line-thermometer.js?v=1.0.112' in app
          for name in ('v186-enterprise-admin.js','v187-collaborative-planning.js','v188-driver-inbox.js','v189-collective-tickets.js','v190-weekly-planning.js','v191-bulk-drivers.js','v192-collective-smart.js','v193-published-driver-edits.js','v194-sick-approval-batches.js','v195-intuitive-segment-change.js','v196-generation-feedback.js','v197-service-blocks.js','v198-planning-ux.js','v199-cockpit-responsive.js','v200-home-voice-test.js','v201-holiday-crew-ui.js'):
              assert f'{name}?v=1.0.112' in app
          assert app.index('v184-navigation-resume.js?v=1.0.112') < app.index('</head>')
          assert '<title>Mon SAEIV · 1.0.112</title>' in app
          assert 'login-gateway.js?v=1.0.112' in gateway
          assert 'Voyageur ?' not in gateway
          assert Path('site/voyageurs/index.html').is_file()
          assert 'Espace conducteur' not in Path('site/voyageurs/index.html').read_text(encoding='utf-8')
          assert "window.MonSAEIVNavigationV184?.isRecovering?.()===true" in Path('site/v128-gps.js').read_text(encoding='utf-8')
          editor=Path('site/v174-grid-editor.js').read_text(encoding='utf-8')
          for token in ('v174SelectionBar','contextmenu','cut_overrides','delete_test_driver','25 %','Retirer de la grille'):
              assert token in editor
          absences=Path('site/v176-driver-absences.js').read_text(encoding='utf-8')
          for token in ('RH · Repos hebdomadaire','CP · Congés payés','absence_kind','absence_all_day','Disponible · retirer RH/CP'):
              assert token in absences
          smart=Path('site/v177-smart-rest-unavailability.js').read_text(encoding='utf-8')
          for token in ('driver_unavailability','45 h de repos hebdomadaire','6e jour','35 h','maxConsecutiveDays','Indisponibilité horaire','interceptGeneration','complétion des journées','activeOnly:true','planningRank','openedDays','conducteurs éligibles','Chargement automatique de toutes les courses','engine.isTestDriver?.(d)','engine.knowsLine?.(s,settings.get(String(d.user_id)),d)'):
              assert token in smart
          generation=Path('site/v167-generation-engine.js').read_text(encoding='utf-8')
          for token in ('targetWorkMinutes:420','targetAmplitudeMinutes:660','hardMaxAmplitudeMinutes:780','exceptional14hAutomatic:false','planningRank,scheduleEconomy','isTestDriver','if(isTestDriver(driver))return true'):
              assert token in generation
          board=Path('site/v165-exploitation-board.js').read_text(encoding='utf-8')
          assert 'Tu n’as pas besoin de les sélectionner une par une' in board
          sick=Path('site/v178-sick-reassignment.js').read_text(encoding='utf-8')
          for token in ('Arrêt maladie','REPLACER COURSE NON PLACÉE','planning_reassignment_queue','register_sick_leave','reassigned_after_sick_leave'):
              assert token in sick
          repair=Path('site/v179-minimal-repair.js').read_text(encoding='utf-8')
          for token in ('maxMovedExistingCourses:2','maxAffectedExistingDrivers:2','findMinimalRepair','Réorganisation minimale','jamais de reconstruction globale'):
              assert token in repair
          dispatch=Path('site/v180-dispatch-messages.js').read_text(encoding='utf-8')
          for token in ('dispatch_messages','dispatch_message_acknowledgements','J’AI LU','Correspondance','v180Open'):
              assert token in dispatch
          supervision=Path('site/v183-live-supervision.js').read_text(encoding='utf-8')
          for token in ('Supervision réseau','saeiv_live_courses','organization_id','Haut-le-pied','v183Open','iconAnchor:[16,16]','v183-mobile-tabs','data-mobile-view','setMobileView','100dvh','env(safe-area-inset-bottom)','orientationchange','simulatedRows','routeShape','plan_items','simulation_progress','SIMULATION'):
              assert token in supervision
          fixes=Path('site/v184-navigation-resume.js').read_text(encoding='utf-8')
          for token in ('AUTO_REROUTE_V184','GPS BRUT','Reprendre la dernière course','speechHealth','requestedStops','v184Management','MonSAEIVCourseStartV186','askStartMode','recalibrateFromPosition','COURSE_RECALAGE_GPS_V186','Je suis déjà sur la ligne'):
              assert token in fixes
          live=Path('site/v182-live-tracking.js').read_text(encoding='utf-8')
          for token in ('askStartMode',"mode==='hlp'",'recalibrateFromPosition','preferredCurrent:flow.resumeHint'):
              assert token in live
          ops=Path('site/v136-driver-operations.js').read_text(encoding='utf-8')
          assert "k.startsWith('mon-saeiv-clean-')" in ops
          assert "FluoPlanningV316?.prepareLinkedCourse" in ops
          assert "ensureExactPatternGeometry(globalThis.state.pattern)" in ops
          assert "hasGeometry" in ops
          speech=Path('site/v131-speech.js').read_text(encoding='utf-8')
          for token in ('IS_IOS','announcementOutput','announcementContext','unlockAnnouncementAudio','playIOSCloudBlob','gesture-initialized-webaudio-resilient',"state==='interrupted'"):
              assert token in speech
          assert 'prepareAudioFromGesture' in speech
          assert 'IOS_SILENT_WAV' not in speech
          assert 'iosCloudAudio' not in speech
          import json
          routes54=json.loads(Path('site/data/54/routes.json').read_text(encoding='utf-8')).get('routes') or []
          by54={str(r.get('short','')).strip():r for r in routes54}
          for code in ('4464','4465'):
              assert code in by54, f'ligne scolaire 54 {code} absente du GTFS publié'
          school54=[r for r in routes54 if str(r.get('short','')).strip().isdigit() and len(str(r.get('short','')).strip())==4]
          assert len(school54)>=180, f'catalogue scolaire 54 anormalement incomplet: {len(school54)} lignes'
          print(f'Mon SAEIV 1.0.112 validé · scolaires 54={len(school54)} · audio iPhone résilient')
          PY

          grep -q "const CACHE='mon-saeiv-clean-1.0.112'" site/sw.js
          grep -q '"name": "Mon SAEIV 1.0.112"' site/manifest.webmanifest
          grep -q './v185-line-thermometer.js' site/sw.js
          grep -q './v186-enterprise-admin.js' site/sw.js
          # Regression check: never bounce a just-authenticated cloud user to the gateway.
          grep -q 'aucune redirection temporelle' site/v160-entry-bridge.js
          grep -q 'MonSAEIVCloudV156?.logout' site/v160-entry-bridge.js
          grep -q './app.html' site/login-gateway.js
          grep -q './v187-collaborative-planning.js' site/sw.js
          grep -q './v188-driver-inbox.js' site/sw.js
          grep -q './app.html' site/sw.js
          grep -q './login-gateway.js' site/sw.js
          grep -q '57SMH04' site/data/57/routes.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Mon SAEIV website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
