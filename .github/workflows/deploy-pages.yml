# Déploiement final Mon SAEIV 1.0.38 — bascule numérotation Fluo du 1er septembre
name: Build and deploy Fluo SAEIV

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild expected V11 folders
        shell: bash
        run: |
          set -e
          mkdir -p scripts/trace_overrides site/data
          cp build_gtfs.py scripts/build_gtfs.py
          cp 54.json scripts/trace_overrides/54.json
          cp 57.json scripts/trace_overrides/57.json
          cp index.html site/index.html
          cp app.js site/app.js
          cp styles.css site/styles.css
          cp sw.js site/sw.js
          cp manifest.webmanifest site/manifest.webmanifest
          [ -f fluo_build.json ] && cp fluo_build.json site/fluo_build.json || true
          for f in v128-gps.js v128-offline.js v130-session-orientation.js v131-speech.js v132-journals.js v133-profile-journals.js v134-journal-front.js v135-journal-router.js v136-driver-operations.js v137-driver-hub.js; do
            [ -f "$f" ] && cp "$f" "site/$f"
          done
          python - <<'PY'
          from pathlib import Path
          import json,re
          VERSION='1.0.38'

          # Garde-fou : neutralise la boucle MutationObserver V136 même si une ancienne
          # révision réapparaissait dans un cache/build.
          op=Path('site/v136-driver-operations.js')
          if op.exists():
              x=op.read_text(encoding='utf-8')
              x=x.replace("const old=q('v133ProfileBtn');if(old){old.textContent='👤 Mon profil';old.classList.add('v316-menu-entry')}","const old=q('v133ProfileBtn');if(old){if(old.textContent!=='👤 Mon profil')old.textContent='👤 Mon profil';old.classList.add('v316-menu-entry')}")
              x=x.replace("new MutationObserver(()=>ensureMenu()).observe(menu,{childList:true,subtree:true})","new MutationObserver(()=>ensureMenu()).observe(menu,{childList:true})")
              op.write_text(x,encoding='utf-8')

          p=Path('site/index.html')
          t=p.read_text(encoding='utf-8')
          for mod in ('v130-session-orientation','v131-speech','v132-journals','v133-profile-journals','v134-journal-front','v135-journal-router','v136-driver-operations','v137-driver-hub'):
              t=re.sub(rf'\./{re.escape(mod)}\.js\?v=1\.0\.\d+',f'./{mod}.js?v={VERSION}',t)
          injections=[
            ('v133RuntimeProfileJournals','v133-profile-journals.js'),
            ('v134RuntimeJournalFront','v134-journal-front.js'),
            ('v135RuntimeJournalRouter','v135-journal-router.js'),
            ('v136RuntimeDriverOperations','v136-driver-operations.js'),
            ('v137RuntimeDriverHub','v137-driver-hub.js'),
          ]
          for ident,src in injections:
              if ident not in t:
                  i=t.rfind('</body>')
                  if i!=-1:t=t[:i]+f'<script id="{ident}" src="./{src}?v={VERSION}"></script>\n'+t[i:]
          t=re.sub(r'manifest\.webmanifest\?v=1\.0\.\d+',f'manifest.webmanifest?v={VERSION}',t)
          t=re.sub(r'sw\.js\?v=1\.0\.\d+',f'sw.js?v={VERSION}',t)
          t=re.sub(r'<title>Mon SAEIV · 1\.0\.\d+</title>',f'<title>Mon SAEIV · {VERSION}</title>',t)
          p.write_text(t,encoding='utf-8')

          # Service worker publié : cache neuf pour forcer la bascule au 1er septembre.
          sw=Path('site/sw.js')
          s=sw.read_text(encoding='utf-8')
          s=re.sub(r"const C='mon-saeiv-v1-0-\d+';", "const C='mon-saeiv-v1-0-38';", s, count=1)
          s=re.sub(r"const CORE=\[[^\n]+\];", "const CORE=['./','index.html','manifest.webmanifest','fluo_build.json','v128-gps.js','v128-offline.js','v130-session-orientation.js','v131-speech.js','v132-journals.js','v133-profile-journals.js','v134-journal-front.js','v135-journal-router.js','v136-driver-operations.js','v137-driver-hub.js'];", s, count=1)
          s=re.sub(r'1\.0\.\d+',VERSION,s)
          anchor='  return t;\n}'
          extras=[]
          for ident,src in [('v134RuntimeJournalFront','v134-journal-front.js'),('v135RuntimeJournalRouter','v135-journal-router.js'),('v136RuntimeDriverOperations','v136-driver-operations.js'),('v137RuntimeDriverHub','v137-driver-hub.js')]:
              if ident not in s:
                  extras.append(f'''  if(!t.includes('id="{ident}"'))t=t.replace(/<\\/body>\\s*<\\/html>\\s*$/i,`<script id="{ident}" src="./{src}?v={VERSION}"><\\/script><\\/body><\\/html>`);''')
          if extras and anchor in s:s=s.replace(anchor,'\n'.join(extras)+'\n'+anchor)
          sw.write_text(s,encoding='utf-8')

          mp=Path('site/manifest.webmanifest')
          try:
              m=json.loads(mp.read_text(encoding='utf-8'))
              m['name']='Mon SAEIV 1.0.38';m['start_url']='./?v=1.0.38';m['orientation']='any'
              m['description']='Mon SAEIV — SAEIV multiréseaux avec numérotation Fluo actualisée au 1er septembre 2026, Espace conducteur, GPS, annonces, journaux, planning et caisse locale préservée.'
              mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          except Exception as e: print('manifest version warning',e)
          bp=Path('site/fluo_build.json')
          if bp.exists():
              try:
                  d=json.loads(bp.read_text(encoding='utf-8'));d['version']=VERSION;bp.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              except Exception as e: print('build json version warning',e)
          PY
          touch site/data/.gitkeep

      - name: Validate runtime JavaScript and numbering cutover
        shell: bash
        run: |
          set -e
          node --check site/v132-journals.js
          node --check site/v133-profile-journals.js
          node --check site/v134-journal-front.js
          node --check site/v135-journal-router.js
          node --check site/v136-driver-operations.js
          node --check site/v137-driver-hub.js
          node --check site/sw.js
          grep -q "v137RuntimeDriverHub" site/index.html
          grep -q "mon-saeiv-v1-0-38" site/sw.js
          grep -q "resources/80423/download" site/index.html
          grep -q "resources/80417/download" site/index.html
          grep -q "resources/80419/download" site/index.html
          grep -q "fluo-regional-gtfs-v138-cutover" site/index.html
          grep -q "monSaeivCashV123" site/index.html
          ! grep -q "localStorage.clear" site/index.html

      - name: Download and prepare official Fluo GTFS 54 and 57
        run: python scripts/build_gtfs.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload SAEIV website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
