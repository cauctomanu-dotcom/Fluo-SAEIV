name: Mon SAEIV 1.0.38 numbering cutover

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v138-numbering-cutover.yml'

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply 1 September numbering cutover
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re

          VERSION='1.0.38'
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')

          old_sources="""  sources:{
              '54':['https://transport.data.gouv.fr/resources/83635/download','https://www.data.gouv.fr/api/1/datasets/r/dcf8b63c-51f4-4cf1-9411-2825ed493358'],
              '57':['https://www.data.gouv.fr/api/1/datasets/r/42be7185-b2a8-4d1e-80c4-f7c402655260'],
              '67':['https://transport.data.gouv.fr/resources/83635/download','https://www.data.gouv.fr/api/1/datasets/r/dcf8b63c-51f4-4cf1-9411-2825ed493358'],
              '68':['https://transport.data.gouv.fr/resources/83635/download','https://www.data.gouv.fr/api/1/datasets/r/dcf8b63c-51f4-4cf1-9411-2825ed493358']
            },
            labels:"""
          new_sources="""  sources:{
              '54':['https://transport.data.gouv.fr/resources/80423/download','https://transport.data.gouv.fr/resources/83635/download'],
              '57':['https://www.data.gouv.fr/api/1/datasets/r/42be7185-b2a8-4d1e-80c4-f7c402655260'],
              '67':['https://transport.data.gouv.fr/resources/80417/download','https://transport.data.gouv.fr/resources/83635/download'],
              '68':['https://transport.data.gouv.fr/resources/80419/download']
            },
            dedicatedResource:{'54':'80423','67':'80417','68':'80419'},
            labels:"""
          if old_sources not in t: raise SystemExit('FluoRemoteGTFS source block not found')
          t=t.replace(old_sources,new_sources,1)

          old="const cacheName='fluo-regional-gtfs-v31-24',stampKey='fluo-regional-gtfs-v31-24-stamp',fresh=Date.now()-Number(localStorage.getItem(stampKey)||0)<86400000;let r=null;"
          new="const resource=FluoRemoteGTFS.dedicatedResource?.[String(dept)]||'',cacheName='fluo-regional-gtfs-v138-cutover',stampKey=`fluo-regional-gtfs-v138-stamp:${String(dept)}:${url}`,fresh=Date.now()-Number(localStorage.getItem(stampKey)||0)<21600000;let r=null;"
          if old not in t: raise SystemExit('old regional cache logic not found')
          t=t.replace(old,new,1)

          old="const b=new Uint8Array(await r.arrayBuffer());if(b[0]!==0x50||b[1]!==0x4b)throw new Error('réponse non ZIP');return{bytes:b,url}"
          new="const b=new Uint8Array(await r.arrayBuffer());if(b[0]!==0x50||b[1]!==0x4b)throw new Error('réponse non ZIP');return{bytes:b,url:r.url||url,sourceUrl:url,dedicated:!!resource&&String(url).includes(`/resources/${resource}/download`)}"
          if old not in t: raise SystemExit('remote ZIP return not found')
          t=t.replace(old,new,1)

          old="const allRoutes=fluoCsvObjects(routesTxt),stopsRaw=fluoCsvObjects(stopsTxt),allTrips=fluoCsvObjects(tripsTxt),calendar=fluoCsvObjects(calTxt),dates=fluoCsvObjects(datesTxt);\n    const routes=allRoutes.filter(r=>fluoRegionalRouteBelongs(r,d)),routeIds=new Set(routes.map(r=>String(r.route_id)));"
          new="const allRoutes=fluoCsvObjects(routesTxt),stopsRaw=fluoCsvObjects(stopsTxt),allTrips=fluoCsvObjects(tripsTxt),calendar=fluoCsvObjects(calTxt),dates=fluoCsvObjects(datesTxt),scoped=!!got.dedicated;\n    const routes=(scoped?allRoutes:allRoutes.filter(r=>fluoRegionalRouteBelongs(r,d))),routeIds=new Set(routes.map(r=>String(r.route_id)));"
          if old not in t: raise SystemExit('regional route filter not found')
          t=t.replace(old,new,1)

          if "if(fluoRegionalStopBelongs(x,d))stopList.push(z)" not in t: raise SystemExit('regional stop filter not found')
          t=t.replace("if(fluoRegionalStopBelongs(x,d))stopList.push(z)","if(scoped||fluoRegionalStopBelongs(x,d))stopList.push(z)",1)

          old="return{dept:d,url:got.url,entries,routesRaw:routes,routes:routeIndex,stops,stopList,services,tripsByRoute,tripById,textCache:new Map(),regional:true};"
          new="return{dept:d,url:got.url,sourceUrl:got.sourceUrl,dedicated:scoped,entries,routesRaw:routes,routes:routeIndex,stops,stopList,services,tripsByRoute,tripById,textCache:new Map(),regional:true};"
          if old not in t: raise SystemExit('regional feed return not found')
          t=t.replace(old,new,1)

          old="  }catch{return jget(`data/${dept}/routes.json`);}\n}\nasync function fluoServicesData(dept){\n  try{return (await fluoDeptCore(dept)).servicesIndex;}\n  catch{return jget(`data/${dept}/services.json`);}\n}\nasync function fluoStopsData(dept){\n  try{return (await fluoDeptCore(dept)).stopsIndex;}\n  catch{return jget(`data/${dept}/stops.json`);}\n}"
          new="  }catch(e){if(fluoUsesRegionalData(String(dept)))throw e;return jget(`data/${dept}/routes.json`);}\n}\nasync function fluoServicesData(dept){\n  try{return (await fluoDeptCore(dept)).servicesIndex;}\n  catch(e){if(fluoUsesRegionalData(String(dept)))throw e;return jget(`data/${dept}/services.json`);}\n}\nasync function fluoStopsData(dept){\n  try{return (await fluoDeptCore(dept)).stopsIndex;}\n  catch(e){if(fluoUsesRegionalData(String(dept)))throw e;return jget(`data/${dept}/stops.json`);}\n}"
          if old not in t: raise SystemExit('legacy fallback block not found')
          t=t.replace(old,new,1)

          t=re.sub(r'manifest\.webmanifest\?v=1\.0\.\d+',f'manifest.webmanifest?v={VERSION}',t,count=1)
          t=re.sub(r'<title>Mon SAEIV · 1\.0\.\d+</title>',f'<title>Mon SAEIV · {VERSION}</title>',t,count=1)
          t=re.sub(r"const APP_VERSION = '1\.0\.\d+';",f"const APP_VERSION = '{VERSION}';",t,count=1)
          p.write_text(t,encoding='utf-8')

          bp=Path('fluo_build.json')
          d=json.loads(bp.read_text(encoding='utf-8'))
          d['version']=VERSION
          d.setdefault('numbering_switch',{})['status']='ACTIVE depuis le 01/09/2026'
          feeds=d.setdefault('feeds',{})
          feeds['54_from_2026_09_01']={'source':'Fluo Grand Est 54 — GTFS officiel dédié','url':'https://transport.data.gouv.fr/resources/80423/download','fallback':'https://transport.data.gouv.fr/resources/83635/download','mode':'nouvelle numérotation officielle ; aucun repli silencieux vers les anciens numéros après la date de bascule'}
          feeds['67']={'source':'Fluo Grand Est 67 — GTFS officiel dédié','url':'https://transport.data.gouv.fr/resources/80417/download','fallback':'https://transport.data.gouv.fr/resources/83635/download','mode':'numérotation pilotée directement par le flux officiel du département'}
          feeds['68']={'source':'Fluo Grand Est 68 — GTFS officiel dédié','url':'https://transport.data.gouv.fr/resources/80419/download','mode':'numérotation pilotée directement par le flux officiel du département'}
          bp.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          mp=Path('manifest.webmanifest')
          m=json.loads(mp.read_text(encoding='utf-8'))
          m['name']=f'Mon SAEIV {VERSION}'
          m['start_url']=f'./?v={VERSION}'
          m['description']='Mon SAEIV — SAEIV multiréseaux avec numérotation Fluo actualisée au 1er septembre 2026, Espace conducteur, GPS, annonces, journaux, planning et caisse locale préservée.'
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          sw=Path('sw.js')
          s=sw.read_text(encoding='utf-8')
          s=re.sub(r"const C='mon-saeiv-v1-0-\d+';","const C='mon-saeiv-v1-0-38';",s,count=1)
          s=re.sub(r'1\.0\.\d+',VERSION,s)
          sw.write_text(s,encoding='utf-8')

          assert 'monSaeivCashV123' in t
          assert 'localStorage.clear' not in t
          assert all(x in t for x in ('resources/80423/download','resources/80417/download','resources/80419/download','fluo-regional-gtfs-v138-cutover'))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html fluo_build.json manifest.webmanifest sw.js
          git rm .github/workflows/v138-numbering-cutover.yml
          git commit -m 'Mon SAEIV 1.0.38: active la numérotation Fluo du 1er septembre'
          git push
