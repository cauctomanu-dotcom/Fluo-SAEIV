name: Inspect TC Infos Fluo 54 mappings

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-tcinfos-fluo54.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read public line pages
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import urllib.request,re
          pages={455:38937,460:38938,461:38939,465:38961,466:38964,468:38969,469:39564,470:39567,471:39569,472:39570,480:39568,490:39563,495:39565,496:39566}
          for new,pid in pages.items():
              url=f'https://tc-infos.fr/reseau/983/ligne/{pid}'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              try:
                  raw=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','ignore')
              except Exception as e:
                  print('ERR',new,pid,e); continue
              text=re.sub(r'<script.*?</script>|<style.*?</style>',' ',raw,flags=re.S|re.I)
              text=re.sub(r'<[^>]+>',' ',text)
              text=re.sub(r'\s+',' ',text)
              m=re.search(r'ancienne ligne\s+([A-Za-z0-9]+)',text,re.I)
              print('MAP',new,'<=',m.group(1) if m else '?','|',text[:500])
          PY
