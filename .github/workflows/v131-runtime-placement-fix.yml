name: Mon SAEIV 1.0.31 runtime placement fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v131-runtime-placement-fix.yml'

permissions:
  contents: write

jobs:
  fix-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replacer les modules runtime au vrai bas de page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Retire toutes les anciennes injections, y compris celles tombées dans les modèles HTML des rapports.
          s=re.sub(r'\n?\s*<script(?:\s+id="v130RuntimeOrientation")?\s+src="\./v130-session-orientation\.js\?v=1\.0\.(?:30|31)"></script>\s*', '\n', s)
          s=re.sub(r'\n?\s*<script(?:\s+id="v131RuntimeSpeech")?\s+src="\./v131-speech\.js\?v=1\.0\.31"></script>\s*', '\n', s)
          pos=s.rfind('</body>')
          if pos < 0:
              raise SystemExit('Balise </body> finale introuvable')
          runtime='\n<script id="v130RuntimeOrientation" src="./v130-session-orientation.js?v=1.0.31"></script>\n<script id="v131RuntimeSpeech" src="./v131-speech.js?v=1.0.31"></script>\n'
          s=s[:pos]+runtime+s[pos:]
          p.write_text(s,encoding='utf-8')

          swp=Path('sw.js')
          lines=swp.read_text(encoding='utf-8').splitlines()
          lines=[line for line in lines if "if(!t.includes('v130-session-orientation.js'))" not in line and "if(!t.includes('v131-speech.js'))" not in line]
          out=[]
          for line in lines:
              if line.strip()=='return t;':
                  out.append("  if(!t.includes('id=\\\"v130RuntimeOrientation\\\"'))t=t.replace(/<\\/body>\\s*<\\/html>\\s*$/i,`<script id=\\\"v130RuntimeOrientation\\\" src=\\\"./v130-session-orientation.js?v=1.0.31\\\"><\\/script><\\/body><\\/html>`);")
                  out.append("  if(!t.includes('id=\\\"v131RuntimeSpeech\\\"'))t=t.replace(/<\\/body>\\s*<\\/html>\\s*$/i,`<script id=\\\"v131RuntimeSpeech\\\" src=\\\"./v131-speech.js?v=1.0.31\\\"><\\/script><\\/body><\\/html>`);")
              out.append(line)
          swp.write_text('\n'.join(out)+'\n',encoding='utf-8')

          Path('.github/workflows/v131-runtime-placement-fix.yml').unlink()
          PY

      - name: Commit correctif runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js .github/workflows/v131-runtime-placement-fix.yml
          git commit -m "Mon SAEIV 1.0.31: charge correctement les modules runtime"
          git push
