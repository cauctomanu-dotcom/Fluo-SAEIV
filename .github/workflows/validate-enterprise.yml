name: Validate SAEIV Enterprise 1.0.104
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-enterprise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check app source syntax
        run: |
          set -euo pipefail
          for f in v165-exploitation-board.js v156-supabase-sync.js v167-generation-engine.js v186-enterprise-admin.js v187-collaborative-planning.js v188-driver-inbox.js v189-collective-tickets.js v190-weekly-planning.js v191-bulk-drivers.js v192-collective-smart.js v193-published-driver-edits.js v194-sick-approval-batches.js v195-intuitive-segment-change.js v197-service-blocks.js v198-planning-ux.js v174-grid-editor.js v178-sick-reassignment.js v131-speech.js v185-line-thermometer.js v188-driver-inbox.js sw.js; do
            node --check "$f"
          done
      - name: Contract tests for permission and consent workflow
        run: |
          node tests/planning-workflow-v192.test.cjs
          node tests/unified-planning-v194.test.cjs
          node tests/generation-observable-v197.test.cjs
          node tests/daily-service-generation-v198.test.cjs
          node tests/draft-visibility-v199.test.cjs
          node tests/service-envelope-ui-v1100.test.cjs
          node tests/driver-day-detail-v1101.test.cjs
          node tests/cockpit-controls-v1102.test.cjs
          node tests/iphone-audio-responsive-v1103.test.cjs
          node tests/home-voice-android-v1104.test.cjs
          node tests/published-change-consent-v195.test.cjs
          node tests/intuitive-segment-v196.test.cjs
          node tests/driver-line-v191.test.cjs
      - name: Verify migration and publishing assets
        run: |
          python - <<'PY'
          from pathlib import Path
          m=Path('supabase/migrations/20261008160000_enterprise_planning_v192.sql').read_text()
          workflow=Path('.github/workflows/deploy-pages.yml').read_text()
          sw=Path('sw.js').read_text()
          manifest=Path('manifest.webmanifest').read_text()
          for token in ['saeiv_propose_change','saeiv_respond_change','saeiv_finalize_change','saeiv_acquire_lock','saeiv_heartbeat_lock','saeiv_planning_audit','saeiv_published_days']:
              assert token in m
          for name in ['v186-enterprise-admin.js','v187-collaborative-planning.js','v188-driver-inbox.js','v197-service-blocks.js','v198-planning-ux.js']:
              assert name in workflow and name in sw
          assert '1.0.104' in manifest and '1.0.104' in sw
          assert 'saeiv_published_days' in Path('v156-supabase-sync.js').read_text()
          print('SAEIV 1.0.104 enterprise sources verified')
          PY