name: Validate SAEIV Enterprise 1.0.93
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-enterprise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check app source syntax
        run: |
          set -euo pipefail
          for f in v156-supabase-sync.js v167-generation-engine.js v186-enterprise-admin.js v187-collaborative-planning.js v188-driver-inbox.js sw.js; do
            node --check "$f"
          done
      - name: Contract tests for permission and consent workflow
        run: |
          node tests/planning-workflow-v192.test.cjs
          node tests/driver-line-v191.test.cjs
      - name: Verify migration and publishing assets
        run: |
          python - <<'PY'
          from pathlib import Path
          m=Path('supabase/migrations/20261008160000_enterprise_planning_v192.sql').read_text()
          workflow=Path('.github/workflows/deploy-pages.yml').read_text()
          sw=Path('sw.js').read_text()
          manifest=Path('manifest.webmanifest').read_text()
          for token in ['saeiv_propose_change','saeiv_respond_change','saeiv_finalize_change','saeiv_acquire_lock','saeiv_heartbeat_lock','saeiv_planning_audit','saeiv_published_days']:
              assert token in m
          for name in ['v186-enterprise-admin.js','v187-collaborative-planning.js','v188-driver-inbox.js']:
              assert name in workflow and name in sw
          assert '1.0.93' in manifest and '1.0.93' in sw
          assert 'saeiv_published_days' in Path('v156-supabase-sync.js').read_text()
          print('SAEIV 1.0.93 enterprise sources verified')
          PY