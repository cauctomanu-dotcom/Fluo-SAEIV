name: Validate Mon SAEIV 1.0.88
on:
  push:
    branches: [ "fix/1.0.88-duty-generation" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check v165-exploitation-board.js
          node --check v167-generation-engine.js
          node --check v177-smart-rest-unavailability.js
          node --check sw.js
      - name: Duty generation invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          engine=Path('v167-generation-engine.js').read_text(encoding='utf-8')
          smart=Path('v177-smart-rest-unavailability.js').read_text(encoding='utf-8')
          board=Path('v165-exploitation-board.js').read_text(encoding='utf-8')
          for token in ('1.0.88','targetWorkMinutes:420','targetAmplitudeMinutes:660','softMaxAmplitudeMinutes:780','hardMaxAmplitudeMinutes:780','exceptional14hAutomatic:false','planningRank,scheduleEconomy'):
              assert token in engine, token
          for token in ('1.0.88','complétion des journées','activeOnly:true','planningRank','openedDays','conducteurs éligibles','Chargement automatique de toutes les courses'):
              assert token in smart, token
          assert "compactOnly&&eco.cutCount>4" in engine
          assert "maxPaidCut>=120" not in engine
          assert "Tu n’as pas besoin de les sélectionner une par une" in board
          w=Path('.github/workflows/deploy-pages.yml').read_text(encoding='utf-8')
          assert '1.0.88' in w and 'range(22,88)' in w
          assert "const CACHE='mon-saeiv-clean-1.0.88'" in Path('sw.js').read_text(encoding='utf-8')
          print('Generation journées 1.0.88 OK')
          PY
