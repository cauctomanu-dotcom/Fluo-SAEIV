name: Mon SAEIV 1.0.39 source cleanup

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v139-clean-source.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove obsolete duplicate Fluo runtime reference
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          t,n=re.subn(r'\s*<script id="v139RuntimeFluoPublished"[^>]*></script>\s*','\n',t)
          if n>1: raise SystemExit(f'trop de références obsolètes supprimées: {n}')
          assert 'v139RuntimeStaticFluo' not in t or t.count('v139RuntimeStaticFluo')<=1
          assert 'monSaeivCashV123' in t
          assert 'localStorage.clear' not in t
          p.write_text(t,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Source déjà propre'
          else
            git commit -m 'Mon SAEIV 1.0.39: supprime le moteur Fluo obsolète'
            git push
          fi
