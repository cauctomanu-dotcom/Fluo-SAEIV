name: Inspect Fluo numbering source

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-fluo-numbering-source.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query official Fluo mappings directly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,urllib.request
          from html.parser import HTMLParser
          UA='Mozilla/5.0'; page='https://www.fluo.grandest.fr/nouveaux-numeros/'
          text=urllib.request.urlopen(urllib.request.Request(page,headers={'User-Agent':UA}),timeout=30).read().decode('utf-8','replace')
          m=re.search(r'var GPPA = (\{[^\n]+\});',text)
          cfg=json.loads(m.group(1)); nonce=cfg['NONCE']; ajax=cfg['AJAXURL']+'?action=gppa_get_batch_field_html'
          def call(value):
              payload={'form-id':39,'lead-id':None,'field-ids':[4],'gravityview-meta':False,
                'field-values':{'1':value},'merge-tags':[],'lmt-nonces':{},'current-merge-tag-values':{},
                'security':nonce,'show_admin_fields_in_ajax':''}
              r=urllib.request.Request(ajax,data=json.dumps(payload).encode(),headers={'User-Agent':UA,'Content-Type':'application/json','Referer':page})
              raw=urllib.request.urlopen(r,timeout=30).read().decode('utf-8','replace')
              ans=json.loads(raw); return str(ans.get('fields',{}).get('4',''))
          tests=['54R350','54R350 - CHATEAU-SALINS / NANCY','54R360','54R360 - CHAMBREY - NANCY','54R710','54R060','54R330']
          for v in tests:
              try:
                  out=call(v)
                  print('\nTEST',repr(v),'LEN',len(out))
                  print(out[:2000])
              except Exception as e: print('ERR',repr(v),repr(e))
          PY
