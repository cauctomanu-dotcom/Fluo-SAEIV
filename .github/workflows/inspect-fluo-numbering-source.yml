name: Inspect Fluo numbering source

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-fluo-numbering-source.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Complete official Fluo mappings from departmental feeds
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/67.zip 'https://transport.data.gouv.fr/resources/80417/download'
          curl -L --fail --retry 3 -o /tmp/68.zip 'https://transport.data.gouv.fr/resources/80419/download'
          python - <<'PY'
          import csv,io,json,re,urllib.request,time,zipfile
          from concurrent.futures import ThreadPoolExecutor,as_completed
          from html.parser import HTMLParser
          from pathlib import Path

          UA='Mozilla/5.0'; page='https://www.fluo.grandest.fr/nouveaux-numeros/'
          text=urllib.request.urlopen(urllib.request.Request(page,headers={'User-Agent':UA}),timeout=30).read().decode('utf-8','replace')
          m=re.search(r'var GPPA = (\{[^\n]+\});',text)
          if not m: raise SystemExit('GPPA config absent')
          cfg=json.loads(m.group(1)); nonce=cfg['NONCE']; ajax=cfg['AJAXURL']+'?action=gppa_get_batch_field_html'
          current=json.loads(Path('fluo-numbering-2026.json').read_text(encoding='utf-8'))

          class P(HTMLParser):
              def __init__(self):super().__init__();self.opts=[];self.cur=None
              def handle_starttag(self,tag,attrs):
                  if tag=='option':self.cur={'attrs':dict(attrs),'text':''}
              def handle_data(self,data):
                  if self.cur is not None:self.cur['text']+=data
              def handle_endtag(self,tag):
                  if tag=='option' and self.cur is not None:self.opts.append(self.cur);self.cur=None

          def feed_routes(path,dept):
              blob=Path(path).read_bytes(); z=zipfile.ZipFile(io.BytesIO(blob))
              with z.open('routes.txt') as raw:
                  rows=list(csv.DictReader(io.TextIOWrapper(raw,encoding='utf-8-sig',newline='')))
              out=[]
              for r in rows:
                  short=(r.get('route_short_name') or '').strip(); long=(r.get('route_long_name') or '').strip()
                  if not short:continue
                  out.append({'dept':dept,'old':short,'long':long,'route_id':str(r.get('route_id') or '')})
              return out

          def variants(item):
              d=item['dept']; s=item['old']; l=item['long']
              vals=[]
              for short in (s, d+s if not s.startswith(d) else s):
                  vals.append(f'{short} - {l}' if l else short)
              # Some feeds use technical department prefixes that the public selector omits.
              if s.startswith(d):
                  s2=s[len(d):]
                  vals.append(f'{s2} - {l}' if l else s2)
              # Deduplicate preserving order.
              return list(dict.fromkeys(vals))

          def query(item):
              for label in variants(item):
                  payload={'form-id':39,'lead-id':None,'field-ids':[4],'gravityview-meta':False,
                    'field-values':{'1':label},'merge-tags':[],'lmt-nonces':{},'current-merge-tag-values':{},
                    'security':nonce,'show_admin_fields_in_ajax':''}
                  data=json.dumps(payload).encode(); last=None
                  for attempt in range(3):
                      try:
                          req=urllib.request.Request(ajax,data=data,headers={'User-Agent':UA,'Content-Type':'application/json','Referer':page})
                          raw=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
                          ans=json.loads(raw); fh=str(ans.get('fields',{}).get('4',''))
                          p=P();p.feed(fh)
                          vals=[]
                          for o in p.opts:
                              v=(o['attrs'].get('value') or '').strip(); txt=o['text'].strip()
                              if v and 'No Results' not in txt and txt not in ('–','—'): vals.append((v,txt))
                          if vals:
                              out=dict(item);out['new']=vals[0][0];out['official_result_text']=vals[0][1];out['official_query_label']=label;return out
                          break
                      except Exception as e:
                          last=e; time.sleep(.5*(attempt+1))
              return None

          selected=feed_routes('/tmp/67.zip','67')+feed_routes('/tmp/68.zip','68')
          print('DEDICATED_CANDIDATES', {d:sum(x['dept']==d for x in selected) for d in ('67','68')})
          mapped=[];failed=[]
          with ThreadPoolExecutor(max_workers=8) as ex:
              fs={ex.submit(query,x):x for x in selected}
              done=0
              for f in as_completed(fs):
                  x=fs[f];res=f.result();done+=1
                  (mapped if res else failed).append(res or x)
                  if done%50==0:print('PROGRESS',done,'mapped',len(mapped),'failed',len(failed))
          for d in ('67','68'):
              mp={x['old']:{'new':x['new'],'long':x['long'],'route_id':x['route_id']} for x in mapped if x['dept']==d}
              # Only official positive responses are applied. A 67 regular line therefore remains unchanged.
              current['departments'][d]=mp
              current['unmapped'][d]=[{'old':x['old'],'long':x['long'],'route_id':x['route_id']} for x in failed if x['dept']==d]
              print('DEPT',d,'MAPPED',len(mp),'UNMAPPED',len(current['unmapped'][d]))
              print('SAMPLES',list(mp.items())[:20])
          current['generated_from']='official Fluo selector + departmental GTFS labels (54/67/68)'
          Path('fluo-numbering-2026.json').write_text(json.dumps(current,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fluo-numbering-2026.json
          git commit -m 'Complète la table officielle Fluo 67 et 68' || exit 0
          git push
