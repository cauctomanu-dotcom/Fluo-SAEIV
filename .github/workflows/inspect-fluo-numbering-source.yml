name: Inspect Fluo numbering source

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-fluo-numbering-source.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official numbering page source
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o /tmp/fluo.html 'https://www.fluo.grandest.fr/nouveaux-numeros/'
          echo 'SIZE' $(wc -c </tmp/fluo.html)
          echo '=== MATCHES R350 / 465 / R360 / 468 ==='
          grep -oiE '.{0,180}(54R350|R350|54R360|R360|>465<|>468<).{0,220}' /tmp/fluo.html | head -80 || true
          echo '=== FORM MARKERS ==='
          grep -oiE '.{0,120}(gravity|gform|wpforms|forminator|acf|select2|nouveau.{0,30}num|ancien.{0,30}num).{0,180}' /tmp/fluo.html | head -120 || true
          echo '=== SCRIPT SRCS ==='
          grep -oE '<script[^>]+src=[^ >]+' /tmp/fluo.html | sed 's/&amp;/\&/g' | tail -80 || true
          echo '=== SELECT / OPTION SAMPLE ==='
          grep -oiE '<(select|option)[^>]*>[^<]{0,180}' /tmp/fluo.html | head -120 || true
