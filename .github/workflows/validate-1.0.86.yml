name: Validate Mon SAEIV 1.0.86
on:
  push:
    branches: [ "fix/1.0.86-start-mode-recalage" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check v182-live-tracking.js
          node --check v184-navigation-resume.js
          node --check sw.js
      - name: Start mode invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          a=Path('v184-navigation-resume.js').read_text(encoding='utf-8')
          b=Path('v182-live-tracking.js').read_text(encoding='utf-8')
          for token in ('1.0.86','MonSAEIVCourseStartV186','askStartMode','recalibrateFromPosition','COURSE_RECALAGE_GPS_V186','Je suis déjà sur la ligne','setResumeHint'):
              assert token in a, token
          for token in ('askStartMode',"mode==='hlp'",'recalibrateFromPosition','preferredCurrent:flow.resumeHint'):
              assert token in b, token
          assert "const CACHE='mon-saeiv-clean-1.0.86'" in Path('sw.js').read_text(encoding='utf-8')
          w=Path('.github/workflows/deploy-pages.yml').read_text(encoding='utf-8')
          assert '1.0.86' in w and 'range(22,86)' in w
          print('HLP / déjà en ligne 1.0.86 OK')
          PY
