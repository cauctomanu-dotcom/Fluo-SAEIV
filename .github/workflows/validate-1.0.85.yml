name: Validate Mon SAEIV 1.0.85
on:
  push:
    branches: [ "fix/1.0.85-independent-announcement-audio" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check v131-speech.js
          node --check v184-navigation-resume.js
          node --check sw.js
      - name: Independent announcement audio invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('v131-speech.js').read_text(encoding='utf-8')
          for token in ('1.0.85','announcementOutput','announcementContext','unlockAnnouncementAudio','playIOSCloudBlob','independent-webaudio','sortie annonces SAEIV autonome'):
              assert token in s, token
          assert 'IOS_SILENT_WAV' not in s
          assert 'iosCloudAudio' not in s
          assert "const media=IS_IOS?iosCloudPlayer():new Audio()" not in s
          assert "if(IS_IOS&&!announcementOutput.unlocked)return launchLocal" in s
          w=Path('.github/workflows/deploy-pages.yml').read_text(encoding='utf-8')
          assert '1.0.85' in w
          assert 'range(22,85)' in w
          assert "const CACHE='mon-saeiv-clean-1.0.85'" in Path('sw.js').read_text(encoding='utf-8')
          print('Independent SAEIV audio checks OK')
          PY
