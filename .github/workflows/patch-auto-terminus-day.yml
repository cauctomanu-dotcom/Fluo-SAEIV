name: Patch auto terminus and day flow

on:
  push:
    paths:
      - '.github/workflows/patch-auto-terminus-day.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch driver runtime
        env:
          PATCH_B64: ""
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          p = Path('v137-driver-hub.js')
          text = p.read_text(encoding='utf-8')
          marker = 'Mon SAEIV 1.0.42 — fin automatique au terminus + enchaînement Ma journée.'
          if marker not in text:
              text = text.replace('Mon SAEIV 1.0.37 — Espace conducteur centralisé.', 'Mon SAEIV 1.0.42 — Espace conducteur centralisé.')
              text = text.replace("const VERSION='1.0.37';", "const VERSION='1.0.42';")
              text = text.replace("console.info('[Mon SAEIV] 1.0.37 Espace conducteur centralisé actif');", "console.info('[Mon SAEIV] 1.0.42 Espace conducteur centralisé actif');")
              text += base64.b64decode(os.environ['PATCH_B64']).decode('utf-8')
              p.write_text(text, encoding='utf-8')
          PY
          node --check v137-driver-hub.js
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-auto-terminus-day.yml
          git add v137-driver-hub.js
          git diff --cached --check
          git commit -m "Mon SAEIV 1.0.42: termine les courses au terminus et enchaine le planning"
          git push
