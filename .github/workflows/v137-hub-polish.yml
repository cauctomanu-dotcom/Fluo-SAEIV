name: Mon SAEIV 1.0.37 hub polish

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/v137-hub-polish.yml' ]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Consolidate driver menu
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v137-driver-hub.js')
          t=p.read_text(encoding='utf-8')
          old='''</div></section><div class="v137-note">Les fonctions restent les mêmes : Mon profil sert désormais de point d'entrée unique pour les informations liées au conducteur.'''
          new='''</div></section><section class="v137-section"><h3>Mes services & ventes</h3><div class="v137-grid"><button class="v137-card" data-v137-open="tad"><div class="ico">📞</div><strong>Mes TAD</strong><span>Mes courses TAD préparées et enregistrées.</span></button><button class="v137-card" data-v137-open="tickets"><div class="ico">🎫</div><strong>Mes billets</strong><span>Mes billets collectifs préparés pour mes services.</span></button><button class="v137-card" data-v137-open="cash"><div class="ico">💶</div><strong>Ma caisse</strong><span>Fonds de caisse, ventes et historique des titres.</span></button></div></section><div class="v137-note">Les fonctions restent les mêmes : Mon profil sert désormais de point d'entrée unique pour les informations liées au conducteur.'''
          if old in t:t=t.replace(old,new,1)
          marker="""    if(which==='planning'){q('v316PlanningBtn')?.click();return}\n"""
          addition="""    if(which==='planning'){q('v316PlanningBtn')?.click();return}\n    if(which==='tad'){q('v26MyTadsBtn')?.click();return}\n    if(which==='tickets'){q('v304MyCollectivesBtn')?.click();return}\n    if(which==='cash'){q('v108CashBtn')?.click();return}\n"""
          if marker in t:t=t.replace(marker,addition,1)
          oldids="['v135JournalBtn','v13JournalBtn','v136VehicleBtn','v136ContactsBtn','v136EndDayBtn']"
          newids="['v135JournalBtn','v13JournalBtn','v136VehicleBtn','v136ContactsBtn','v136EndDayBtn','v316PlanningBtn','v26MyTadsBtn','v304MyCollectivesBtn','v108CashBtn']"
          if oldids in t:t=t.replace(oldids,newids,1)
          p.write_text(t,encoding='utf-8')
          PY
          node --check v137-driver-hub.js
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/v137-hub-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v137-driver-hub.js .github/workflows/v137-hub-polish.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Mon SAEIV 1.0.37: centralise les outils personnels conducteur'
          git push
