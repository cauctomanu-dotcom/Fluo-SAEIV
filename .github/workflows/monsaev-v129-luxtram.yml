name: Mon SAEIV 1.0.29 LuxTram

on:
  push:
    paths:
      - '.github/workflows/monsaev-v129-luxtram.yml'
      - '.github/scripts/v129_luxtram_patch.py'

permissions:
  contents: write

jobs:
  patch-luxtram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Appliquer la migration 1.0.29
        run: python .github/scripts/v129_luxtram_patch.py
      - name: Vérifier la syntaxe
        run: |
          node --check sw.js
          grep -q "LuxTram · Luxembourg" index.html
          grep -q "filter:'luxtram'" index.html
          grep -q "urban:luxtram" index.html
          python -m json.tool manifest.webmanifest >/dev/null
          python -m json.tool fluo_build.json >/dev/null
      - name: Committer la version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.webmanifest sw.js fluo_build.json README_DEPLOIEMENT.txt VERSION_1_0_29.md
          git commit -m 'Mon SAEIV 1.0.29: ajout LuxTram'
          git push
