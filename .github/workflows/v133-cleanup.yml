name: Mon SAEIV 1.0.33 cleanup

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v133-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean runtime placement
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          tag='<script id="v133RuntimeProfileJournals" src="./v133-profile-journals.js?v=1.0.33"></script>\n'
          t=t.replace(tag,'')
          pos=t.rfind('</body>')
          if pos < 0:
              raise SystemExit('final </body> not found')
          t=t[:pos]+tag+t[pos:]
          # Les runtimes directement référencés par l’index portent aussi le numéro public courant.
          t=t.replace('v130-session-orientation.js?v=1.0.32','v130-session-orientation.js?v=1.0.33')
          t=t.replace('v131-speech.js?v=1.0.32','v131-speech.js?v=1.0.33')
          t=t.replace('v132-journals.js?v=1.0.32','v132-journals.js?v=1.0.33')
          p.write_text(t,encoding='utf-8')

          p=Path('sw.js')
          t=p.read_text(encoding='utf-8')
          t=t.replace("document.title='Mon SAEIV · 1.0.32'","document.title='Mon SAEIV · 1.0.33'")
          t=t.replace("e.textContent='MON SAEIV · 1.0.32'","e.textContent='MON SAEIV · 1.0.33'")
          t=t.replace("b.textContent='Version 1.0.32'","b.textContent='Version 1.0.33'")
          p.write_text(t,encoding='utf-8')
          PY

          rm -f .github/workflows/v133-cleanup.yml

      - name: Commit cleanup
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js .github/workflows/v133-cleanup.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Mon SAEIV 1.0.33: nettoie le chargement runtime"
          git push
