name: Attach planning TAD bridge 1.0.46
on:
  push:
    paths:
      - '.github/workflows/attach-v146-planning-tad-bridge.yml'
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach bridge to always-loaded driver runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v137-driver-hub.js')
          s=p.read_text(encoding='utf-8')
          marker='v146RuntimePlanningTadBridge'
          if marker not in s:
              s += '''\n\n'use strict';\n/* Mon SAEIV 1.0.46 — charge le pont TAD planning même avec un ancien index PWA. */\n(()=>{\n  if(document.getElementById('v146RuntimePlanningTadBridge'))return;\n  const s=document.createElement('script');\n  s.id='v146RuntimePlanningTadBridge';\n  s.async=false;\n  s.src='./v146-planning-tad-bridge.js?v=1.0.46';\n  document.head.appendChild(s);\n})();\n'''
          s=s.replace("const VERSION='1.0.44'","const VERSION='1.0.46'")
          p.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          x=idx.read_text(encoding='utf-8')
          if 'v146-planning-tad-bridge.js' not in x:
              pos=x.rfind('</body>')
              if pos < 0: raise SystemExit('No real </body> found')
              x=x[:pos]+'<script src="./v146-planning-tad-bridge.js?v=1.0.46"></script>\n'+x[pos:]
          idx.write_text(x,encoding='utf-8')
          PY
          node --check v145-planning-tad.js
          node --check v146-planning-tad-bridge.js
          node --check v137-driver-hub.js
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/attach-v146-planning-tad-bridge.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v137-driver-hub.js index.html v146-planning-tad-bridge.js .github/workflows/attach-v146-planning-tad-bridge.yml
          git commit -m 'Mon SAEIV 1.0.46: fiabilise le menu TAD du planning' || exit 0
          git push