name: Diagnose Fluo 54 school routes
on:
  push:
    branches: [ "fix/1.0.90-school-audio" ]
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build current Fluo data
        run: |
          rm -rf site scripts
          mkdir -p site/data scripts/trace_overrides
          cp build_gtfs.py scripts/build_gtfs.py
          cp build_gtfs_2026.py scripts/build_gtfs_2026.py
          cp 54.json scripts/trace_overrides/54.json
          cp 57.json scripts/trace_overrides/57.json
          cp index.html site/index.html
          cp sw.js site/sw.js
          cp v128-offline.js site/v128-offline.js
          python scripts/build_gtfs_2026.py
      - name: Inspect unified regional GTFS for missing 54 routes
        run: |
          python - <<'PY'
          import csv,io,urllib.request,zipfile
          url='https://transport.data.gouv.fr/resources/83635/download'
          req=urllib.request.Request(url,headers={'User-Agent':'FluoSAEIV/1.0.90'})
          with urllib.request.urlopen(req,timeout=120) as r: blob=r.read()
          z=zipfile.ZipFile(io.BytesIO(blob))
          with z.open('routes.txt') as raw:
              rows=list(csv.DictReader(io.TextIOWrapper(raw,encoding='utf-8-sig')))
          by={str(x.get('route_short_name','')).strip():x for x in rows}
          print('REGIONAL_ROUTES',len(rows))
          for code in ('4273','4446','4465','4312'):
              x=by.get(code)
              print('REGIONAL',code,'FOUND' if x else 'MISSING', (x or {}).get('route_long_name',''), (x or {}).get('route_id',''))
          PY
      - name: Verify school routes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('site/data/54/routes.json').read_text(encoding='utf-8'))
          routes=x.get('routes',[])
          by_short={str(r.get('short','')).strip():r for r in routes}
          print('ROUTES_54',len(routes))
          for code in ('4465','4312','4464','4466'):
              print(code, 'FOUND' if code in by_short else 'MISSING', by_short.get(code,{}).get('long',''))
          assert '4465' in by_short, '4465 missing from built Fluo 54 catalogue'
          assert any(len(str(r.get('short','')).strip())==4 for r in routes), 'no four-digit school lines in Fluo 54 catalogue'
          mapping=json.loads(Path('fluo-numbering-2026.json').read_text(encoding='utf-8')).get('departments',{}).get('54',{})
          expected={str(v.get('new','')).strip() for v in mapping.values() if str(v.get('new','')).strip()}
          built={str(r.get('short','')).strip() for r in routes}
          missing=sorted(expected-built)
          print('EXPECTED_NUMBERED_54',len(expected),'MISSING_FROM_GTFS',len(missing))
          print('MISSING_CODES',','.join(missing))
          for old,v in mapping.items():
              if str(v.get('new','')).strip() in missing:
                  print('MISSING_DETAIL',old,'=>',v.get('new'),v.get('long',''))
          PY
