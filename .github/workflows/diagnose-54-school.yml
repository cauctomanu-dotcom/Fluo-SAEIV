name: Diagnose Fluo 54 school routes
on:
  push:
    branches: [ "fix/1.0.90-school54-audio" ]
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check v131-speech.js
          node --check v165-exploitation-board.js
      - name: Build current official GTFS
        run: |
          rm -rf site scripts
          mkdir -p site/data scripts/trace_overrides
          cp index.html site/index.html
          cp build_gtfs.py scripts/build_gtfs.py
          cp build_gtfs_2026.py scripts/build_gtfs_2026.py
          cp 54.json scripts/trace_overrides/54.json
          cp 57.json scripts/trace_overrides/57.json
          python scripts/build_gtfs_2026.py
      - name: Check 54 school routes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('site/data/54/routes.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          routes=d.get('routes') or []
          print('ROUTES54',len(routes))
          for code in ('4464','4465'):
              xs=[r for r in routes if str(r.get('short','')).strip()==code]
              print(code,[(x.get('id'),x.get('long'),x.get('patterns'),x.get('service_ids')) for x in xs])
              assert xs, f'{code} absent'
          schools=[r for r in routes if str(r.get('short','')).strip().isdigit() and len(str(r.get('short','')).strip())==4]
          print('SCHOOLS54',len(schools))
          PY
      - name: Validate integrated radio runtime
        run: |
          grep -q "wasPlayingBeforeDuck" site/index.html
          grep -q "arrêt demandé = Web Audio + duck radio réversible" site/index.html
          grep -q "arrêt demandé = Web Audio + duck radio réversible" app.js
          grep -q "independent-webaudio-resilient" v131-speech.js
          python externalize_runtime.py site/index.html
          find site/runtime -name 'part-*.js' -print0 | xargs -0 -n1 node --check
          grep -q "wasPlayingBeforeDuck" site/runtime/part-*.js
          grep -q "arrêt demandé = Web Audio + duck radio réversible" site/runtime/part-*.js
